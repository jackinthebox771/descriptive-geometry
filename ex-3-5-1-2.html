 shape.dataset.face=f.id;shape.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}};g.append(shape);
 f.vertices.forEach((a,i)=>{const b=f.vertices[(i+1)%f.vertices.length],pa=ps[i],pb=ps[(i+1)%ps.length];const hit=node('line',{x1:pa[0],y1:pa[1],x2:pb[0],y2:pb[1],stroke:'transparent','stroke-width':12,'data-edge':i,'data-face':f.id});g.append(hit)});
 $('model').append(g);
 }
 if(selected?.kind==='edge'){
  const [a,b]=selected.vertices.map(projectModel);$('model').append(node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#b72a80','stroke-width':4,'pointer-events':'none'}));
 }
 $('modelMinus').disabled=modelScale<=.6;$('modelPlus').disabled=modelScale>=1.7;
}
faces.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.name;$('faceSelect').append(o)});
$('faceSelect').onchange=e=>{if(e.target.value===''){choose(null);return}const f=faces[+e.target.value];choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})};
$('toggleModel').onclick=()=>{const hidden=!$('modelContent').hidden;$('modelContent').hidden=hidden;document.querySelector('.workspace').classList.toggle('model-open',!hidden);$('toggleModel').textContent=hidden?'显示 3D 模型':'隐藏 3D 模型';$('toggleModel').setAttribute('aria-expanded',!hidden);drawModel();updateHighlight()};
function modelZoom(delta){modelScale=Math.min(1.7,Math.max(.6,modelScale+delta));drawModel()}
$('modelMinus').onclick=()=>modelZoom(-.1);$('modelPlus').onclick=()=>modelZoom(.1);
$('modelReset').onclick=()=>{az=.8;el=.52;modelScale=1;drawModel()};$('clearSelection').onclick=()=>choose(null);
$('model').addEventListener('wheel',e=>{e.preventDefault();modelZoom(e.deltaY>0?-.08:.08)},{passive:false});
$('model').onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,az,el,target:e.target,moved:false};$('model').setPointerCapture(e.pointerId)};
$('model').onpointermove=e=>{if(!modelDrag)return;const dx=e.clientX-modelDrag.x,dy=e.clientY-modelDrag.y;if(Math.hypot(dx,dy)>4)modelDrag.moved=true;if(modelDrag.moved){az=modelDrag.az+dx*.009;el=Math.min(1.5,Math.max(-1.5,modelDrag.el+dy*.009));drawModel()}};
$('model').onpointerup=e=>{if(!modelDrag)return;const d=modelDrag;modelDrag=null;if(d.moved)return;const t=d.target;if(t.dataset.face!==undefined){const f=faces[+t.dataset.face];if(t.dataset.edge!==undefined){const i=+t.dataset.edge;choose({kind:'edge',name:f.name+'的棱线',vertices:[f.vertices[i],f.vertices[(i+1)%f.vertices.length]]})}else choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}else choose(null)};
$('model').onpointercancel=()=>modelDrag=null;
// A common face projector serves both teaching overlays and model selection.
const faceViews=[p=>[95+1.65*p[0],245-1.65*p[2]],p=>[500+1.65*p[1],245-1.65*p[2]],p=>[95+1.65*p[0],355+1.65*p[1]]];
function projectObjects(objects,view){
 const g=node('g',{'data-view':view}),segments=[],fills=new Set(),dots=new Set();
 const near=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<.001;
 const key=p=>p.map(v=>v.toFixed(5)).join(',');
 const on=(p,a,b)=>Math.abs((p[0]-a[0])*(b[1]-a[1])-(p[1]-a[1])*(b[0]-a[0]))<.001&&p[0]>=Math.min(a[0],b[0])-.001&&p[0]<=Math.max(a[0],b[0])+.001&&p[1]>=Math.min(a[1],b[1])-.001&&p[1]<=Math.max(a[1],b[1])+.001;
 for(const obj of objects){
  const ps=obj.vertices.map(faceViews[view]);
  const area=Math.abs(ps.reduce((s,p,i)=>{const q=ps[(i+1)%ps.length];return s+p[0]*q[1]-q[0]*p[1]},0));
  const fillKey=ps.map(key).sort().join('|');
  if(obj.kind!=='edge'&&area>.001&&!fills.has(fillKey)){fills.add(fillKey);g.append(node('path',{d:pathD(ps),style:'stroke:none','data-face-tint':'true'}));}
  if(ps.every(p=>near(p,ps[0]))){if(!dots.has(key(ps[0]))){dots.add(key(ps[0]));g.append(node('circle',{cx:ps[0][0],cy:ps[0][1],r:5}));}continue;}
  for(let i=0;i<(obj.kind==='edge'?1:ps.length);i++){const a=ps[i],b=ps[(i+1)%ps.length];if(!near(a,b))segments.push([a,b]);}
 }
 // Split overlapping accumulated edges at all endpoints, then draw each piece once.
 const endpoints=segments.flat(),seen=new Set();
 for(const [a,b] of segments){const ps=endpoints.filter(p=>on(p,a,b)).sort((p,q)=>(p[0]-q[0])*(b[0]-a[0])+(p[1]-q[1])*(b[1]-a[1]));
  for(let i=1;i<ps.length;i++){const c=ps[i-1],d=ps[i];if(near(c,d))continue;const k=[key(c),key(d)].sort().join('|');if(seen.has(k))continue;seen.add(k);
   // This solid has no distinct hidden projected edges: occluded edges coincide
   // with visible contours. Visible coincident lines therefore take priority.
   g.append(node('path',{d:`M${c} L${d}`,style:'fill:none','stroke-dasharray':'none','data-visibility':'visible'}));
  }
 }
 return g;
}
updateHighlight=function(){
 $('scene').querySelector('.selection-overlay')?.remove();
 if(!selected||$('modelContent').hidden)return;
 const g=node('g',{class:'selection-overlay'});
 for(let v=0;v<3;v++)g.append(projectObjects([selected],v));
 $('scene').append(g);
};
let analysisTimer=null,analysisGeneration=0;
const originalRender=render;
render=function(animate=true){
 clearTimeout(analysisTimer);const generation=++analysisGeneration;
 originalRender(animate);
 const ids=({3:[6],4:[7],5:[8,9]})[current];if(!ids)return;
 const objects=ids.map(id=>({...faces[id],kind:'face'}));
 const g=node('g',{class:'teaching-overlay','pointer-events':'none'});
 g.style.cssText='stroke:#b72a80;stroke-width:3;fill:#e346a32b';
 // Known projections appear first; the derived view follows actual construction.
 for(const v of [0,2])g.append(projectObjects(objects,v));
 $('scene').append(g);
 const reveal=()=>{if(generation===analysisGeneration&&g.isConnected)g.append(projectObjects(objects,1));};
 if(drawDuration>0)analysisTimer=setTimeout(reveal,drawDuration+40);else reveal();
};

render();drawModel();
</script></body></html>

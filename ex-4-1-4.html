<script>
const shapeGeometry=(()=>{
  const shoulderZ=60,seamZ=28,half=94,upperHalf=65;
  const d=Object.freeze({half,depth:91,height:115,upperHalf,upperDepth:51,shoulderZ,seamZ,midHalf:half+(upperHalf-half)*seamZ/shoulderZ,slotHalf:36,slotZ:80});
  const bottom=[[-d.half,0,0],[d.half,0,0],[d.half,d.depth,0],[-d.half,d.depth,0]];
  const shoulder=[[-d.upperHalf,0,d.shoulderZ],[d.upperHalf,0,d.shoulderZ],[d.upperHalf,d.upperDepth,d.shoulderZ],[-d.upperHalf,d.upperDepth,d.shoulderZ]];
  const section=y=>[[-d.upperHalf,y,d.shoulderZ],[d.upperHalf,y,d.shoulderZ],[d.upperHalf,y,d.height],[d.slotHalf,y,d.height],[d.slotHalf,y,d.slotZ],[-d.slotHalf,y,d.slotZ],[-d.slotHalf,y,d.height],[-d.upperHalf,y,d.height]];
  const seamEdge=[[-d.midHalf,d.upperDepth,d.seamZ],[d.midHalf,d.upperDepth,d.seamZ]];
  const feature=(points,kind='solid-edge',closed=false)=>({points,kind,closed});
  const projectionFeatures={
    front:[
      feature([[-d.half,0,0],[-d.upperHalf,0,d.shoulderZ],[-d.upperHalf,0,d.height],[-d.slotHalf,0,d.height],[-d.slotHalf,0,d.slotZ],[d.slotHalf,0,d.slotZ],[d.slotHalf,0,d.height],[d.upperHalf,0,d.height],[d.upperHalf,0,d.shoulderZ],[d.half,0,0]],'solid-edge',true),
      feature(seamEdge)
    ],
    side:[
      feature([[0,0,0],[0,0,d.height],[0,d.upperDepth,d.height],[0,d.upperDepth,d.shoulderZ],[0,d.upperDepth,d.seamZ],[0,d.depth,0]],'solid-edge',true),
      feature([[0,0,d.shoulderZ],[0,d.upperDepth,d.shoulderZ]]),
      feature([[0,0,d.slotZ],[0,d.upperDepth,d.slotZ]],'hidden-edge')
    ]
  };
  return{d,bottom,shoulder,section,seamEdge,projectionFeatures};
})();

const solidFaces=[],solidEdges=[],edgeSeen=new Set();
const edgeCode=pts=>pts.map(p=>p.map(v=>v.toFixed(4)).join(',')).join(';');
function addFace(pts,key,name){solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=edgeCode(pts),b=edgeCode([...pts].reverse());if(edgeSeen.has(a)||edgeSeen.has(b))return;edgeSeen.add(a);solidEdges.push({pts,key,name})}
function buildSolid(){
  const{d,bottom:b,shoulder:t,section,seamEdge}=shapeGeometry,ml=seamEdge[0],mr=seamEdge[1];
  addFace([...b].reverse(),'lower','底面');
  addFace([b[0],b[1],t[1],t[0]],'lower','后斜面');
  addFace([b[1],b[2],mr,t[2],t[1]],'lower','右侧面');
  addFace([b[2],b[3],ml,mr],'lower','前下斜面');
  addFace([mr,ml,t[3],t[2]],'lower','前上竖面');
  addFace([b[3],b[0],t[0],t[3],ml],'lower','左侧面');
  for(let i=0;i<4;i++){addEdge([b[i],b[(i+1)%4]],'lower','底面轮廓');if(i!==0&&i!==2)addEdge([t[i],t[(i+1)%4]],'lower','斜面体上轮廓')}
  addEdge([b[0],t[0]],'lower','后侧斜棱');addEdge([b[1],t[1]],'lower','后侧斜棱');
  addEdge([b[2],mr,t[2]],'lower','右前轮廓');addEdge([b[3],ml,t[3]],'lower','左前轮廓');
  addEdge(seamEdge,'lower','前斜面水平结构边');
  const rear=section(0),front=section(d.upperDepth);
  addFace(rear,'upper','后表面');addFace([...front].reverse(),'upper','前表面');
  for(let i=1;i<rear.length;i++){const j=(i+1)%rear.length;addFace([rear[i],rear[j],front[j],front[i]],i>=3&&i<=5?'slot':'upper',i===4?'槽底面':'上部侧面')}
  for(let i=0;i<rear.length;i++){const j=(i+1)%rear.length;if(i!==0)addEdge([rear[i],rear[j]],i>=3&&i<=5?'slot':'upper','后表面轮廓');if(i!==0)addEdge([front[i],front[j]],i>=3&&i<=5?'slot':'upper','前表面轮廓');addEdge([rear[i],front[i]],i>=3&&i<=6?'slot':'upper','厚度方向棱')}
}
buildSolid();

function makeLesson(){
  const{d}=shapeGeometry,q=1.15,fO=[150,225],sO=[330,225],iO=[560,445],sp=.95;
  const F=(x,z)=>[fO[0]+x*sp,fO[1]-z*sp],S=(y,z)=>[sO[0]+y*sp,sO[1]-z*sp],I=(x,y,z)=>[iO[0]+q*Math.sqrt(3)/2*(x+y),iO[1]+q*(-.5*x+.5*y-z)];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra}),path=(points,order=0,closed=false,extra={})=>({type:'path',points,order,closed,...extra}),label=(xy,text,dx=0,dy=0,order=0,note=false)=>({type:'text',xy,text,dx,dy,order,note});
  const isoLine=(a,b,order=0,extra={})=>line(I(...a),I(...b),order,extra);
  const projectFeatures=(features,kind,project)=>features.filter(f=>f.kind===kind).map((f,k)=>path(f.points.map(project),k,f.closed));
  const givenFront=projectFeatures(shapeGeometry.projectionFeatures.front,'solid-edge',p=>F(p[0],p[2]));
  const givenSide=projectFeatures(shapeGeometry.projectionFeatures.side,'solid-edge',p=>S(p[1],p[2]));
  const givenHidden=projectFeatures(shapeGeometry.projectionFeatures.side,'hidden-edge',p=>S(p[1],p[2]));
  const brace=(a,b,offset,order,removeAfter)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,sign=Math.sign(offset||1),p=(t,n)=>[a[0]+dx*t+nx*n,a[1]+dy*t+ny*n],p0=p(0,offset),p1=p(.22,offset),p2=p(.43,offset),pm=p(.5,offset+sign*5),p3=p(.57,offset),p4=p(.78,offset),p5=p(1,offset);return{type:'path',d:`M${p0[0]},${p0[1]} C${p1[0]},${p1[1]} ${p2[0]},${p2[1]} ${pm[0]},${pm[1]} C${p3[0]},${p3[1]} ${p4[0]},${p4[1]} ${p5[0]},${p5[1]}`,order,temporary:true,removeAfter}};
  const sourceEdge=(a,b)=>{const dx=Math.abs(b[0]-a[0]),dy=Math.abs(b[1]-a[1]);return dy>dx?[S(a[1],a[2]),S(b[1],b[2])]:[F(a[0],a[2]),F(b[0],b[2])]};
  const measuredLine=(a,b,seq,sourceOverride)=>{const order=seq*4,removeAfter=order+3,[sa,sb]=sourceOverride||sourceEdge(a,b),ia=I(...a),ib=I(...b);return[line(sa,sb,order,{temporary:true,removeAfter}),brace(sa,sb,7,order,removeAfter),line(ia,ib,order+1,{temporary:true,removeAfter}),brace(ia,ib,-8,order+1,removeAfter),isoLine(a,b,order+3)]};
  const bottom=shapeGeometry.bottom,top=shapeGeometry.shoulder;
  const O=[0,0,0],bottomConstruction=[...measuredLine(O,bottom[1],0),...measuredLine(O,bottom[0],1),...measuredLine(bottom[1],bottom[2],2),...measuredLine(bottom[0],bottom[3],3),...measuredLine(bottom[3],bottom[2],4)];
  const lowerConstruction=[];let order=20;
  const middleAxis=[0,0,d.seamZ],middleCenter=[0,d.upperDepth,d.seamZ],middleLeft=shapeGeometry.seamEdge[0],middleRight=shapeGeometry.seamEdge[1];
  lowerConstruction.push(...measuredLine(O,[0,0,d.shoulderZ],0,[F(0,0),F(0,d.shoulderZ)]));
  lowerConstruction.push(...measuredLine([0,0,d.shoulderZ],top[1],1),...measuredLine([0,0,d.shoulderZ],top[0],2),...measuredLine(top[1],top[2],3),...measuredLine(top[0],top[3],4));
  lowerConstruction.push(isoLine(bottom[0],top[0],order++),isoLine(bottom[1],top[1],order++));
  lowerConstruction.push(...measuredLine(O,middleAxis,6,[F(0,0),F(0,d.seamZ)]));
  lowerConstruction.push(...measuredLine(middleAxis,middleCenter,7,[S(0,d.seamZ),S(d.upperDepth,d.seamZ)]));
  lowerConstruction.push(...measuredLine(middleCenter,middleLeft,8,[F(0,d.seamZ),F(-d.midHalf,d.seamZ)]));
  lowerConstruction.push(...measuredLine(middleCenter,middleRight,9,[F(0,d.seamZ),F(d.midHalf,d.seamZ)]));order=40;
  lowerConstruction.push(isoLine(bottom[2],middleRight,order++),isoLine(middleRight,top[2],order++));
  lowerConstruction.push(isoLine(bottom[3],middleLeft,order++),isoLine(middleLeft,top[3],order++));
  const upperConstruction=[];
  upperConstruction.push(...measuredLine(top[0],[-d.upperHalf,0,d.height],0),...measuredLine(top[1],[d.upperHalf,0,d.height],1),...measuredLine([-d.upperHalf,0,d.height],[d.upperHalf,0,d.height],2));
  upperConstruction.push(...measuredLine([-d.upperHalf,0,d.height],[-d.upperHalf,d.upperDepth,d.height],3),...measuredLine([d.upperHalf,0,d.height],[d.upperHalf,d.upperDepth,d.height],4));
  upperConstruction.push(...measuredLine(top[3],[-d.upperHalf,d.upperDepth,d.height],5),...measuredLine(top[2],[d.upperHalf,d.upperDepth,d.height],6),...measuredLine([-d.upperHalf,d.upperDepth,d.height],[d.upperHalf,d.upperDepth,d.height],7));
  const slotConstruction=[];
  const rc=[0,0,d.slotZ],rl=[-d.slotHalf,0,d.slotZ],rr=[d.slotHalf,0,d.slotZ],fl=[-d.slotHalf,d.upperDepth,d.slotZ],fr=[d.slotHalf,d.upperDepth,d.slotZ];
  slotConstruction.push(...measuredLine([0,0,d.shoulderZ],rc,0,[F(0,d.shoulderZ),F(0,d.slotZ)]),...measuredLine(rc,rl,1),...measuredLine(rc,rr,2));
  slotConstruction.push(...measuredLine(rl,[-d.slotHalf,0,d.height],3),...measuredLine(rr,[d.slotHalf,0,d.height],4));
  slotConstruction.push(...measuredLine(rl,fl,5),...measuredLine(rr,fr,6),...measuredLine([-d.slotHalf,0,d.height],[-d.slotHalf,d.upperDepth,d.height],7),...measuredLine([d.slotHalf,0,d.height],[d.slotHalf,d.upperDepth,d.height],8));
  slotConstruction.push(isoLine(fl,fr,36),...measuredLine(fl,[-d.slotHalf,d.upperDepth,d.height],10),...measuredLine(fr,[d.slotHalf,d.upperDepth,d.height],11));
  return{title:'4.1-4',problem:'求作形体的正等测图。',size:[900,650],iso:I,project3:{front:p=>F(p[0],p[2]),side:p=>S(p[1],p[2])},
    layers:[
      {id:'given-front',step:0,role:'projection',elements:givenFront},{id:'given-side',step:0,role:'projection',elements:givenSide},{id:'given-hidden',step:0,role:'projection-hidden',elements:givenHidden},{id:'given-center',step:0,role:'centerline',elements:[line(F(0,-10),F(0,d.height+12))]},
      {id:'projection-axes',step:1,role:'axis',elements:[line(F(-112,0),F(112,0)),line(F(0,-18),F(0,d.height+18)),label(F(0,0),'o′',-22,18),label(F(112,0),'x′',6,7),label(F(0,d.height+18),'z′',-19,-6),line(S(0,-18),S(0,d.height+18)),line(S(0,0),S(d.depth+18,0)),label(S(0,0),'o″',-25,18),label(S(d.depth+18,0),'y″',5,7),label(S(0,d.height+18),'z″',-20,-6)]},
      {id:'iso-horizontal',step:2,role:'guide',endStep:2,elements:[line([430,iO[1]],[820,iO[1]])]},
      {id:'iso-axes',step:2,role:'axis',elements:[line(I(-138,0,0),I(155,0,0),2),line(I(0,0,0),I(0,150,0),2),line([iO[0],iO[1]+70],[iO[0],iO[1]-165],1),label(I(155,0,0),'X₁',8,8,2),label(I(0,150,0),'Y₁',8,18,2),label([iO[0],iO[1]-165],'Z₁',-20,-8,1)]},
      {id:'iso-origin',step:2,role:'axis',endStep:6,elements:[label(iO,'O₁',-31,21,1)]},
      {id:'axis-angles',step:2,role:'construction',endStep:2,elements:[{type:'path',d:`M${iO[0]+48},${iO[1]} A48,48 0 0 0 ${iO[0]+41.57},${iO[1]-24}`,order:3},{type:'path',d:`M${iO[0]+48},${iO[1]} A48,48 0 0 1 ${iO[0]+41.57},${iO[1]+24}`,order:3},label([iO[0]+50,iO[1]-24],'30°',0,0,3,true),label([iO[0]+50,iO[1]+37],'30°',0,0,3,true)]},
      {id:'bottom-construction',step:3,role:'construction',endStep:6,elements:bottomConstruction},
      {id:'lower-construction',step:4,role:'construction',endStep:6,elements:lowerConstruction},
      {id:'upper-construction',step:5,role:'construction',endStep:6,elements:upperConstruction},
      {id:'slot-construction',step:6,role:'construction',endStep:6,elements:slotConstruction},
      {id:'final-visible',step:7,role:'answer-visible',elements:[]}
    ],
    steps:[

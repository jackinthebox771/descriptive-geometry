<script>
const shapeGeometry=(()=>{
  const width=190,depth=54,height=56,rearDepth=25,lowerHalf=73,upperHalf=57,towerInner=43,lowerHeight=12,upperHeight=24,upperFront=39;
  const d=Object.freeze({width,depth,height,rearDepth,lowerHalf,upperHalf,towerInner,lowerHeight,upperHeight,upperFront});
  const solids=[
    {key:'lower',name:'下级台阶',x0:-lowerHalf,x1:lowerHalf,y0:0,y1:depth,z0:0,z1:lowerHeight},
    {key:'upper',name:'上级台阶',x0:-upperHalf,x1:upperHalf,y0:0,y1:upperFront,z0:lowerHeight,z1:upperHeight},
    {key:'towers',name:'左高台',x0:towerInner,x1:width/2,y0:0,y1:rearDepth,z0:0,z1:height},
    {key:'towers',name:'右高台',x0:-width/2,x1:-towerInner,y0:0,y1:rearDepth,z0:0,z1:height}
  ];
  const feature=(points,kind='solid-edge',closed=false)=>({points,kind,closed});
  const front=[
    feature([[width/2,0,0],[-width/2,0,0]]),
    feature([[width/2,0,0],[width/2,0,height],[towerInner,0,height],[towerInner,0,upperHeight]]),
    feature([[-width/2,0,0],[-width/2,0,height],[-towerInner,0,height],[-towerInner,0,upperHeight]]),
    feature([[lowerHalf,0,0],[lowerHalf,0,lowerHeight],[-lowerHalf,0,lowerHeight],[-lowerHalf,0,0]]),
    feature([[upperHalf,0,lowerHeight],[upperHalf,0,upperHeight],[-upperHalf,0,upperHeight],[-upperHalf,0,lowerHeight]])
  ];
  const top=[
    feature([[width/2,0,0],[-width/2,0,0]]),
    feature([[width/2,0,0],[width/2,rearDepth,0],[towerInner,rearDepth,0],[towerInner,0,0]],'solid-edge',true),
    feature([[-width/2,0,0],[-width/2,rearDepth,0],[-towerInner,rearDepth,0],[-towerInner,0,0]],'solid-edge',true),
    feature([[lowerHalf,rearDepth,0],[lowerHalf,depth,0],[-lowerHalf,depth,0],[-lowerHalf,rearDepth,0]]),
    feature([[upperHalf,rearDepth,0],[upperHalf,upperFront,0],[-upperHalf,upperFront,0],[-upperHalf,rearDepth,0]])
  ];
  return{d,solids,projectionFeatures:{front,top}};
})();

const solidFaces=[],solidEdges=[],edgeSeen=new Set();
const pointCode=p=>p.map(v=>v.toFixed(4)).join(','),edgeCode=pts=>pts.map(pointCode).join(';');
function addFace(pts,key,name,normal){solidFaces.push({pts,key,name,normal})}
function addEdge(pts,key,name){const a=edgeCode(pts),b=edgeCode([...pts].reverse());if(edgeSeen.has(a)||edgeSeen.has(b))return;edgeSeen.add(a);solidEdges.push({pts,key,name})}
function buildSolid(){
  const{solids}=shapeGeometry,xs=[...new Set(solids.flatMap(b=>[b.x0,b.x1]))].sort((a,b)=>a-b),ys=[...new Set(solids.flatMap(b=>[b.y0,b.y1]))].sort((a,b)=>a-b),zs=[...new Set(solids.flatMap(b=>[b.z0,b.z1]))].sort((a,b)=>a-b);
  const ownerAt=(ix,iy,iz)=>{if(ix<0||iy<0||iz<0||ix>=xs.length-1||iy>=ys.length-1||iz>=zs.length-1)return null;const x=(xs[ix]+xs[ix+1])/2,y=(ys[iy]+ys[iy+1])/2,z=(zs[iz]+zs[iz+1])/2;return solids.find(b=>x>b.x0-1e-7&&x<b.x1+1e-7&&y>b.y0-1e-7&&y<b.y1+1e-7&&z>b.z0-1e-7&&z<b.z1+1e-7)||null};
  const boundary=[];
  for(let ix=0;ix<xs.length-1;ix++)for(let iy=0;iy<ys.length-1;iy++)for(let iz=0;iz<zs.length-1;iz++){
    const owner=ownerAt(ix,iy,iz);if(!owner)continue;const x0=xs[ix],x1=xs[ix+1],y0=ys[iy],y1=ys[iy+1],z0=zs[iz],z1=zs[iz+1];
    const candidates=[
      ['x-',ix-1,iy,iz,[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],['x+',ix+1,iy,iz,[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]]],
      ['y-',ix,iy-1,iz,[[x0,y0,z0],[x0,y0,z1],[x1,y0,z1],[x1,y0,z0]]],['y+',ix,iy+1,iz,[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
      ['z-',ix,iy,iz-1,[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]],['z+',ix,iy,iz+1,[[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],[x1,y0,z1]]]
    ];
    for(const[normal,nx,ny,nz,pts]of candidates)if(!ownerAt(nx,ny,nz)){addFace(pts,owner.key,owner.name+'表面',normal);boundary.push({pts,normal,key:owner.key})}
  }
  const map=new Map();
  for(const f of boundary)for(let i=0;i<4;i++){
    const pts=[f.pts[i],f.pts[(i+1)%4]],a=pointCode(pts[0]),b=pointCode(pts[1]),key=a<b?a+'|'+b:b+'|'+a;
    if(!map.has(key))map.set(key,{pts,normals:new Set(),groups:new Set()});const rec=map.get(key);rec.normals.add(f.normal);rec.groups.add(f.key)
  }
  for(const rec of map.values())if(new Set([...rec.normals].map(n=>n[0])).size>=2){const groups=[...rec.groups],key=groups.includes('towers')?'towers':groups.includes('upper')?'upper':'lower';addEdge(rec.pts,key,key==='towers'?'高台棱线':key==='upper'?'上级台阶棱线':'下级台阶棱线')}
}
buildSolid();

function makeLesson(){
  const{d,solids}=shapeGeometry,q=1.08,fO=[190,220],hO=[190,340],iO=[650,330],sp=1.1;
  const F=(x,z)=>[fO[0]-x*sp,fO[1]-z*sp],P=(x,y)=>[hO[0]-x*sp,hO[1]+y*sp];
  const I=(x,y,z)=>[iO[0]+q*Math.sqrt(3)/2*(-x+y),iO[1]+q*(.5*x+.5*y-z)];
  const AX=t=>I(t,0,0),AY=t=>I(0,t,0),AZ=t=>I(0,0,t);
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra}),path=(points,order=0,closed=false,extra={})=>({type:'path',points,order,closed,...extra}),label=(xy,text,dx=0,dy=0,order=0,note=false)=>({type:'text',xy,text,dx,dy,order,note});
  const isoLine=(a,b,order=0,extra={})=>line(I(...a),I(...b),order,extra),projectFeatures=(features,project)=>features.map((f,k)=>path(f.points.map(project),k,f.closed));
  const givenFront=projectFeatures(shapeGeometry.projectionFeatures.front,p=>F(p[0],p[2])),givenTop=projectFeatures(shapeGeometry.projectionFeatures.top,p=>P(p[0],p[1]));
  const brace=(a,b,offset,order,removeAfter)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,sign=Math.sign(offset||1),p=(t,n)=>[a[0]+dx*t+nx*n,a[1]+dy*t+ny*n],p0=p(0,offset),p1=p(.22,offset),p2=p(.43,offset),pm=p(.5,offset+sign*5),p3=p(.57,offset),p4=p(.78,offset),p5=p(1,offset);return{type:'path',d:'M'+p0[0]+','+p0[1]+' C'+p1[0]+','+p1[1]+' '+p2[0]+','+p2[1]+' '+pm[0]+','+pm[1]+' C'+p3[0]+','+p3[1]+' '+p4[0]+','+p4[1]+' '+p5[0]+','+p5[1],order,temporary:true,removeAfter}};
  const sourceEdge=(a,b,view='auto')=>{if(view==='top')return[P(a[0],a[1]),P(b[0],b[1])];if(view==='front')return[F(a[0],a[2]),F(b[0],b[2])];const dy=Math.abs(b[1]-a[1]);return dy>0?[P(a[0],a[1]),P(b[0],b[1])]:[F(a[0],a[2]),F(b[0],b[2])]};
  const measuredLine=(a,b,seq,view='auto')=>{const order=seq*4,removeAfter=order+3,[sa,sb]=sourceEdge(a,b,view),ia=I(...a),ib=I(...b);return[line(sa,sb,order,{temporary:true,removeAfter}),brace(sa,sb,7,order,removeAfter),line(ia,ib,order+1,{temporary:true,removeAfter}),brace(ia,ib,-8,order+1,removeAfter),isoLine(a,b,order+3)]};
  const horizontalPrism=(b,start=0)=>{
    const out=[],base=[0,b.y0,b.z0],baseL=[b.x0,b.y0,b.z0],baseR=[b.x1,b.y0,b.z0],rearL=[b.x0,b.y0,b.z0],rearR=[b.x1,b.y0,b.z0],frontL=[b.x0,b.y1,b.z0],frontR=[b.x1,b.y1,b.z0],topRearL=[b.x0,b.y0,b.z1],topRearR=[b.x1,b.y0,b.z1],topFrontL=[b.x0,b.y1,b.z1],topFrontR=[b.x1,b.y1,b.z1];
    let seq=start;const measure=(a,c,view)=>out.push(...measuredLine(a,c,seq++,view)),connect=(a,c)=>out.push(isoLine(a,c,seq++*4+3));
    measure(base,baseL,'top');measure(base,baseR,'top');
    measure(rearL,frontL,'top');measure(rearR,frontR,'top');connect(frontL,frontR);
    measure(rearL,topRearL,'front');measure(rearR,topRearR,'front');measure(frontL,topFrontL,'front');measure(frontR,topFrontR,'front');
    connect(topRearL,topRearR);connect(topRearL,topFrontL);connect(topRearR,topFrontR);connect(topFrontL,topFrontR);
    return out
  };
  const towerPrism=(b,start=0)=>{
    const out=[],innerX=Math.abs(b.x0)<Math.abs(b.x1)?b.x0:b.x1,outerX=innerX===b.x0?b.x1:b.x0,
      axisBase=[0,b.y0,b.z0],rearInner=[innerX,b.y0,b.z0],rearOuter=[outerX,b.y0,b.z0],rearInnerTop=[innerX,b.y0,b.z1],rearOuterTop=[outerX,b.y0,b.z1],
      frontInner=[innerX,b.y1,b.z0],frontOuter=[outerX,b.y1,b.z0],frontInnerTop=[innerX,b.y1,b.z1],frontOuterTop=[outerX,b.y1,b.z1];
    let seq=start;const measure=(a,c,view)=>out.push(...measuredLine(a,c,seq++,view)),connect=(a,c)=>out.push(isoLine(a,c,seq++*4+3));
    measure(axisBase,rearInner,'front');
    measure(rearInner,rearOuter,'front');measure(rearInner,rearInnerTop,'front');connect(rearOuter,rearOuterTop);connect(rearInnerTop,rearOuterTop);
    measure(rearInner,frontInner,'top');measure(rearOuter,frontOuter,'top');measure(rearOuterTop,frontOuterTop,'top');measure(rearInnerTop,frontInnerTop,'top');
    connect(frontInner,frontOuter);connect(frontOuter,frontOuterTop);connect(frontOuterTop,frontInnerTop);connect(frontInnerTop,frontInner);
    return{elements:out,next:seq}
  };
  const lower=solids[0],upper=solids[1],left=solids[2],right=solids[3],lowerConstruction=horizontalPrism(lower),upperConstruction=horizontalPrism(upper),leftTower=towerPrism(left,0),rightTower=towerPrism(right,leftTower.next),towersConstruction=[...leftTower.elements,...rightTower.elements];
  return{title:'4.1-3',problem:'求作台阶的正等测图。',size:[900,650],iso:I,project3:{front:p=>F(p[0],p[2]),top:p=>P(p[0],p[1])},
    layers:[
      {id:'given-front',step:0,role:'projection',elements:givenFront},{id:'given-top',step:0,role:'projection',elements:givenTop},
      {id:'projection-axes',step:1,role:'axis',elements:[
        line(F(115,0),F(-115,0)),line(F(0,-10),F(0,d.height+16)),label(F(0,0),'o′',8,18),label(F(115,0),'x′',-12,18),label(F(0,d.height+16),'z′',8,-5),
        line(P(115,0),P(-115,0)),line(P(0,-10),P(0,d.depth+15)),label(P(0,0),'o',8,-8),label(P(115,0),'x',-12,-8),label(P(0,d.depth+15),'y',8,20)
      ]},
      {id:'iso-horizontal',step:2,role:'guide',endStep:2,elements:[line([490,iO[1]],[850,iO[1]])]},
      {id:'iso-axes',step:2,role:'axis',elements:[line(AX(-125),AX(140),2),line(iO,AY(135),2),line([iO[0],iO[1]+38],AZ(125),1),label(AX(140),'X₁',-24,18,2),label(AY(135),'Y₁',8,18,2),label(AZ(125),'Z₁',8,-8,1)]},
      {id:'iso-origin',step:2,role:'axis',endStep:5,elements:[label(iO,'O₁',-31,21,1)]},
      {id:'axis-angles',step:2,role:'construction',endStep:2,elements:[

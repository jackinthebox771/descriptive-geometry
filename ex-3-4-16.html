 const fresh=[...$('scene').querySelectorAll('g.fresh')];fresh.forEach(g=>g.style.animation='none');
 const lines=fresh.flatMap(g=>[...g.children].filter(n=>n.tagName==='line'));
 lines.sort((a,b)=>Number(a.dataset.drawOrder??999)-Number(b.dataset.drawOrder??999));
 const duration=330,gap=90,ends=new Map(),defs=node('defs');$('scene').prepend(defs);
 lines.forEach((n,i)=>{
  const delay=i*(duration+gap),len=n.getTotalLength();if(!len)return;
  const id='draw-mask-'+current+'-'+i;
  const mask=node('mask',{id,maskUnits:'userSpaceOnUse',x:-100,y:-100,width:lesson.size[0]+200,height:lesson.size[1]+200});
  const path=node('path',{d:`M ${n.getAttribute('x1')} ${n.getAttribute('y1')} L ${n.getAttribute('x2')} ${n.getAttribute('y2')}`});
  path.style.cssText=`fill:none;stroke:white;stroke-width:20;stroke-dasharray:${len};stroke-dashoffset:${len}`;
  mask.append(path);defs.append(mask);n.setAttribute('mask',`url(#${id})`);
  n.animate([{opacity:0},{opacity:1}],{duration:1,delay,fill:'both'});
  path.animate([{strokeDashoffset:String(len)},{strokeDashoffset:'0'}],{duration,delay,fill:'both',easing:'linear'});
  const key=n.getAttribute('x2')+','+n.getAttribute('y2');ends.set(key,Math.max(ends.get(key)||0,delay+duration));
 });
 drawDuration=lines.length?(lines.length-1)*(duration+gap)+duration:0;
 fresh.flatMap(g=>[...g.children].filter(n=>n.tagName==='text'||n.tagName==='circle')).forEach(n=>{
  const at=n.dataset.at,p=at&&lesson.points[at];let delay=drawDuration;
  if(p&&ends.has(p.join(',')))delay=ends.get(p.join(','));
  if(current===1&&at&&/^[cdeab]w$/.test(at))delay=('cdeab'.indexOf(at[0])*3+2)*(duration+gap)+duration;
  n.animate([{opacity:0},{opacity:1}],{duration:100,delay,fill:'both'});
 });
}

function stop(){clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false')}
function go(i,animate=true){stop();current=Math.max(0,Math.min(last,i));render(animate)}
function play(){if(timer){stop();return}if(current===last){current=0;render()}$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');function schedule(){timer=setTimeout(()=>{current++;render();if(current>=last){timer=setTimeout(stop,drawDuration+150)}else schedule()},Math.max(Number($('speed').value),drawDuration+750))}schedule()}

document.title=lesson.title;$('title').textContent='【'+lesson.title+'】 '+lesson.problem;$('progress').max=last;
lesson.steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step-button';notation(b,`${i===0?'准备':String(i).padStart(2,'0')} ${s.short||s.title}`);b.onclick=()=>go(i);$('steps').append(b)});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>go(last,false);$('restart').onclick=()=>{zoom=1;offset={x:0,y:0};go(0)};$('play').onclick=play;$('speed').onchange=()=>{if(timer){stop();play()}};$('progress').oninput=e=>go(+e.target.value);
$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);view()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.25);if(zoom===1)offset={x:0,y:0};view()};$('fit').onclick=()=>{zoom=1;offset={x:0,y:0};view()};
$('canvas').onpointerdown=e=>{if(zoom===1)return;drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};$('canvas').setPointerCapture(e.pointerId)};$('canvas').onpointermove=e=>{if(!drag)return;const r=$('diagram').getBoundingClientRect(),scale=Math.min(r.width/(lesson.size[0]/zoom),r.height/(lesson.size[1]/zoom));offset={x:drag.ox+(e.clientX-drag.x)/scale,y:drag.oy+(e.clientY-drag.y)/scale};view()};$('canvas').onpointerup=$('canvas').onpointercancel=()=>drag=null;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch{$('status').textContent='当前浏览器不支持网页全屏，可以使用浏览器的全屏功能。'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.code==='Space'){e.preventDefault();play()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script></body></html>

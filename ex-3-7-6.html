: "保留 a、b、c 的点标记；将宽度经转向线传到 W 面，与 a′、b′、c′ 的等高线相交，标出 a″、b″、c″。", "reason": "H 面定宽度，V 面定高度。a″ 在中心线上，b″ 在右下角，c″ 在左上角。", "formula": "先定 H 面端点，紧接着定 W 面端点"}, {"title": "求 AB 的水平投影", "short": "作 ab", "action": "在 a′b′ 上取中间点，向下投射到前半圆，沿左下圆弧连接 a、b。", "reason": "AB 的每一点都在柱面上，其水平投影必须在圆周上。ab 与圆柱可见轮廓重合，按实线表示。", "formula": "ab：左下四分之一圆弧"}, {"title": "立即转移 AB 的中间点", "short": "AB 侧投影", "action": "保留 H 面三个中间点的高亮，逐点转移宽度并与正面等高线相交，标出 W 面三个对应点，再光滑连接 a″、b″。", "reason": "每个侧面点都由同一空间点的宽度和高度定位；端点已经确定，无需重复作图。", "formula": "H、W 面的三个中间点持续保留"}, {"title": "求 AC 的水平投影", "short": "作 ac", "action": "在 a′c′ 上取中间点，向下投射到后半圆，沿左上圆弧连接 a、c。", "reason": "正面虚线限定后半柱面，故取上半圆交点；ac 同样与水平投影轮廓重合。", "formula": "ac：左上四分之一圆弧"}, {"title": "立即转移 AC 的中间点", "short": "AC 侧投影", "action": "保留 AB 的点标记及 AC 的三个 H 面中间点，转移到 W 面后光滑连接 a″、c″。", "reason": "AC 虽在后半柱面，仍位于左半柱面，故左视投影可见。所有已作中间点保留高亮，便于对照。", "formula": "先 H 后 W；已作点不消失"}, {"title": "核对曲率与可见性", "short": "核对", "action": "检查两弧在 a″ 处具有水平切线，在 b″、c″ 处具有竖直切线。", "reason": "侧投影分别为四分之一椭圆弧。AC 的正面投影不可见，其左视投影仍然可见。", "formula": "侧面两弧均为实线；圆周重合线只画一次"}, {"title": "整理完整解答", "short": "完整解答", "action": "移去辅助线，保留点名、投影轴和完整结果。", "reason": "俯视两条曲线与左半圆周重合；侧面为两条相接的光滑椭圆弧。核对长对正、高平齐、宽相等。", "formula": "新增结果为青绿色；已知正面实虚线保持不变"}], "animateConstruction": true, "spatialPoints": {"a": [-85, 0, 95], "b": [0, 85, 0], "c": [0, -85, 190]}, "curves": {"ab": [[-85.0, 0.0, 95.0], [-84.98361544097551, 1.6688638591534055, 94.98168784579616], [-84.93446808046144, 3.337084339520832, 94.92675844286867], [-84.85257686570085, 5.004018310351068, 94.83523296754801], [-84.73797336731587, 6.66902313686682, 94.70714670464716], [-84.59070176713674, 8.331456928012651, 94.5425490338587], [-84.41081884116873, 9.9906787839162, 94.341503410718], [-84.19839393770407, 11.646049042967281, 94.10408734213983], [-83.95350895058671, 13.296929528419623, 93.83039235653808], [-83.67625828764079, 14.942683794420134, 93.5205239685397], [-83.36674883427459, 16.582677371370902, 93.1746016383069], [-83.02509991227416, 18.21627801052931, 92.79275872548 function draw(){model.replaceChildren();let faces=[];for(let i=0;i<96;i++){let t=i*Math.PI/48,u=(i+1)*Math.PI/48;faces.push([[85*Math.cos(t),85*Math.sin(t),0],[85*Math.cos(u),85*Math.sin(u),0],[85*Math.cos(u),85*Math.sin(u),190],[85*Math.cos(t),85*Math.sin(t),190]])}faces.push(ring(0),ring(190));faces.map(p=>p.map(project)).sort((a,b)=>a.reduce((s,p)=>s+p[2],0)/a.length-b.reduce((s,p)=>s+p[2],0)/b.length).forEach(q=>model.append(node('path',{d:d(q)+'Z',fill:'#d1e8e5',stroke:'#b2d4d0','stroke-width':.35})));
for(const [name,ps] of Object.entries(curves)){for(let i=0;i<ps.length-1;i++){const p=ps[i],q=ps[i+1],front=(p[0]+q[0])*Math.sin(yaw)+(p[1]+q[1])*Math.cos(yaw)>=0;const el=node('path',{d:d([project(p),project(q)]),fill:'none',stroke:selected===name?'#b72a80':name==='ab'?'#dd663c':'#0864c9','stroke-width':selected===name?4:2.5,opacity:front?1:.35});if(!front&&i%5>2)continue;el.dataset.pick=name;model.append(el)}}
Object.entries(lesson.spatialPoints).forEach(([n,p])=>{let q=project(p);model.append(node('text',{x:q[0]+5,y:q[1]-5,style:'font:14px Georgia;stroke:white;stroke-width:2'},n.toUpperCase()))})}
function link(){document.querySelectorAll('.selection-overlay').forEach(e=>e.remove());if(!selected||$('modelContent').hidden)return;const g=node('g',{class:'selection-overlay'});for(const f of [V,H,W]){const el=node('path',{d:d(curves[selected].map(f)),style:'fill:none'});if(f===V&&selected==='ac')el.setAttribute('stroke-dasharray','8 6');g.append(el)}$('scene').append(g)}
window.updateLinked=link;
function choose(id){selected=id;$('selectObject').value=id;$('modelSelection').textContent=id?'曲线 '+id.toUpperCase()+'：三投影联动；背面曲线淡虚线示意。':'拖动旋转 · 滚轮缩放 · 点击曲线';draw();link()}
$('toggleModel').onclick=()=>{const open=$('modelContent').hidden;$('modelContent').hidden=!open;document.querySelector('.workspace').classList.toggle('model-open',open);$('toggleModel').textContent=open?'隐藏 3D 模型':'显示 3D 模型';if(!open)choose('');draw();link()};
$('selectObject').onchange=e=>choose(e.target.value);$('clearSelection').onclick=()=>choose('');$('modelPlus').onclick=()=>{scale=Math.min(1.5,scale+.1);draw()};$('modelMinus').onclick=()=>{scale=Math.max(.5,scale-.1);draw()};$('modelReset').onclick=()=>{yaw=-.7;pitch=.35;scale=1;draw()};
model.onpointerdown=e=>{dragging={x:e.clientX,y:e.clientY,yaw,pitch,pick:e.target.dataset.pick,moved:false};model.setPointerCapture(e.pointerId)};
model.onpointermove=e=>{if(!dragging)return;let dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;if(Math.hypot(dx,dy)>4)dragging.moved=true;if(dragging.moved){yaw=dragging.yaw+dx*.01;pitch=Math.max(-1.3,Math.min(1.3,dragging.pitch+dy*.01));draw()}};
model.onpointerup=()=>{if(dragging&&!dragging.moved&&dragging.pick)choose(dragging.pick);dragging=null};model.onpointercancel=()=>dragging=null;model.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(1.5,scale-e.deltaY*.001));draw()};draw();
// Reveal curves only after their locating projectors have finished.
const original=animateStep;animateStep=function(enabled){original(enabled);if(!enabled||current===last||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const paths=[...$('scene').querySelectorAll('.fresh.answer path')];paths.forEach((p,i)=>p.animate([{opacity:0},{opacity:1}],{delay:drawDuration+i*300,duration:300,fill:'both'}));if(paths.length)drawDuration+=paths.length*300};
})();
</script></body></html>

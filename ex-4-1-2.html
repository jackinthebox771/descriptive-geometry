<script>
const shapeGeometry=(()=>{
  const width=150,depth=92,height=96,lowX=48,highX=110,lowZ=height*lowX/highX,breakY=46;
  const d=Object.freeze({width,depth,height,lowZ,lowX,highX,breakY});
  const v={
    A:[0,0,0],B:[0,0,lowZ],C:[lowX,0,lowZ],D:[highX,0,height],E:[width,0,height],F:[width,0,0],
    V:[0,breakY,0],L:[0,breakY,lowZ],K:[lowX,breakY,lowZ],U:[highX,breakY,height],M:[width,breakY,height],N:[width,breakY,0],
    G:[0,depth,0],J:[lowX,depth,lowZ],Q:[highX,depth,height],I:[width,depth,height],R:[width,depth,0]
  };
  const feature=(points,kind='solid-edge',closed=false)=>({points,kind,closed});
  const projectionFeatures={
    front:[
      feature([v.A,v.B,v.C,v.D,v.E,v.F],'solid-edge',true),
      feature([v.G,v.J],'hidden-edge')
    ],
    top:[
      feature([v.A,v.F,v.R,v.G],'solid-edge',true),
      feature([v.L,v.K,v.C]),
      feature([v.D,v.Q])
    ],
    side:[
      feature([[0,d.depth,0],[0,d.depth,d.height],[0,0,d.height],[0,0,0]],'solid-edge',true),
      feature([v.V,v.L,v.B])
    ]
  };
  return{d,v,projectionFeatures};
})();

const solidFaces=[],solidEdges=[],edgeSeen=new Set();
const edgeCode=pts=>pts.map(p=>p.map(v=>v.toFixed(4)).join(',')).join(';');
function addFace(pts,key,name){solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=edgeCode(pts),b=edgeCode([...pts].reverse());if(edgeSeen.has(a)||edgeSeen.has(b))return;edgeSeen.add(a);solidEdges.push({pts,key,name})}
function buildSolid(){
  const{v}=shapeGeometry,{A,B,C,D,E,F,V,L,K,U,M,N,G,Q,I,R}=v;
  addFace([A,B,C,D,E,F],'profile','前表面');
  addFace([A,B,L,V],'platform','前部左侧面');
  addFace([B,C,K,L],'platform','前部小平台');
  addFace([C,D,U,K],'profile','前部斜面');
  addFace([D,E,M,U],'profile','前部高平台');
  addFace([F,E,M,N],'profile','右侧面');
  addFace([A,F,N,V],'profile','前段底面');
  addFace([V,L,K],'platform','平台后端三角面');
  addFace([V,U,Q,G],'rear','后部斜面');
  addFace([U,M,I,Q],'rear','后部上表面');
  addFace([N,M,I,R],'rear','后部右侧面');
  addFace([V,N,R,G],'rear','后段底面');
  addFace([G,Q,I,R],'rear','后表面');
  const front=[A,B,C,D,E,F];
  for(let i=0;i<front.length;i++)addEdge([front[i],front[(i+1)%front.length]],'profile','前表面轮廓');
  addEdge([A,G],'profile','左底棱');addEdge([F,R],'profile','右底棱');addEdge([E,I],'profile','右上棱');
  addEdge([B,L],'platform','平台左侧棱');addEdge([C,K],'platform','平台右侧棱');
  addEdge([V,L],'platform','三角面竖棱');addEdge([L,K],'platform','平台后棱');addEdge([V,K],'platform','三角面斜棱');
  addEdge([D,U,Q],'profile','上表面纵向棱');
  addEdge([G,Q],'rear','后表面落地斜棱');addEdge([Q,I],'rear','后表面顶棱');addEdge([I,R],'rear','后表面右棱');addEdge([R,G],'rear','后表面底棱');
}
buildSolid();

function makeLesson(){
  const{d,v}=shapeGeometry,q=1.12,fO=[145,215],sO=[360,215],hO=[145,345],iO=[650,420],sp=.9;
  const F=(x,z)=>[fO[0]+x*sp,fO[1]-z*sp],S=(y,z)=>[sO[0]+(d.depth-y)*sp,sO[1]-z*sp],P=(x,y)=>[hO[0]+x*sp,hO[1]+(d.depth-y)*sp];
  const I=(x,y,z)=>{const xr=d.width-x,yr=d.depth-y;return[iO[0]+q*Math.sqrt(3)/2*(-xr+yr),iO[1]+q*(.5*xr+.5*yr-z)]};
  const AX=t=>I(d.width-t,d.depth,0),AY=t=>I(d.width,d.depth-t,0),AZ=t=>I(d.width,d.depth,t);
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra}),path=(points,order=0,closed=false,extra={})=>({type:'path',points,order,closed,...extra}),label=(xy,text,dx=0,dy=0,order=0,note=false)=>({type:'text',xy,text,dx,dy,order,note});
  const isoLine=(a,b,order=0,extra={})=>line(I(...a),I(...b),order,extra);
  const projectFeatures=(features,kind,project)=>features.filter(f=>f.kind===kind).map((f,k)=>path(f.points.map(project),k,f.closed));
  const givenFront=projectFeatures(shapeGeometry.projectionFeatures.front,'solid-edge',p=>F(p[0],p[2]));
  const givenFrontHidden=projectFeatures(shapeGeometry.projectionFeatures.front,'hidden-edge',p=>F(p[0],p[2]));
  const givenTop=projectFeatures(shapeGeometry.projectionFeatures.top,'solid-edge',p=>P(p[0],p[1]));
  const givenSide=projectFeatures(shapeGeometry.projectionFeatures.side,'solid-edge',p=>S(p[1],p[2]));
  const brace=(a,b,offset,order,removeAfter)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,sign=Math.sign(offset||1),p=(t,n)=>[a[0]+dx*t+nx*n,a[1]+dy*t+ny*n],p0=p(0,offset),p1=p(.22,offset),p2=p(.43,offset),pm=p(.5,offset+sign*5),p3=p(.57,offset),p4=p(.78,offset),p5=p(1,offset);return{type:'path',d:'M'+p0[0]+','+p0[1]+' C'+p1[0]+','+p1[1]+' '+p2[0]+','+p2[1]+' '+pm[0]+','+pm[1]+' C'+p3[0]+','+p3[1]+' '+p4[0]+','+p4[1]+' '+p5[0]+','+p5[1],order,temporary:true,removeAfter}};
  const sourceEdge=(a,b)=>{const dx=Math.abs(b[0]-a[0]),dy=Math.abs(b[1]-a[1]),dz=Math.abs(b[2]-a[2]);if(dy>=dx&&dy>=dz)return[P(a[0],a[1]),P(b[0],b[1])];return[F(a[0],a[2]),F(b[0],b[2])]};
  const measuredLine=(a,b,seq,sourceOverride)=>{const order=seq*4,removeAfter=order+3,[sa,sb]=sourceOverride||sourceEdge(a,b),ia=I(...a),ib=I(...b);return[line(sa,sb,order,{temporary:true,removeAfter}),brace(sa,sb,7,order,removeAfter),line(ia,ib,order+1,{temporary:true,removeAfter}),brace(ia,ib,-8,order+1,removeAfter),isoLine(a,b,order+3)]};
  const{A,B,C,D,E,V,L,K,G,Q,R}=v,F0=v.F,I0=v.I,O=R;
  const bottomConstruction=[
    ...measuredLine(O,G,0,[P(d.width,d.depth),P(0,d.depth)]),
    ...measuredLine(O,F0,1,[P(d.width,d.depth),P(d.width,0)]),
    ...measuredLine(G,A,2,[P(0,d.depth),P(0,0)]),
    isoLine(F0,A,12)
  ];
  const highBase=[d.highX,0,0];
  const profileConstruction=[
    ...measuredLine(A,B,0,[F(0,0),F(0,d.lowZ)]),
    ...measuredLine(B,C,1,[F(0,d.lowZ),F(d.lowX,d.lowZ)]),
    ...measuredLine(A,highBase,2,[F(0,0),F(d.highX,0)]),
    ...measuredLine(highBase,D,3,[F(d.highX,0),F(d.highX,d.height)]),
    isoLine(C,D,16),
    ...measuredLine(D,E,5,[F(d.highX,d.height),F(d.width,d.height)]),
    ...measuredLine(F0,E,6,[F(d.width,0),F(d.width,d.height)])
  ];
  const depthConstruction=[
    ...measuredLine(B,L,0,[P(0,0),P(0,d.breakY)]),
    ...measuredLine(C,K,1,[P(d.lowX,0),P(d.lowX,d.breakY)]),
    ...measuredLine(D,Q,2,[P(d.highX,0),P(d.highX,d.depth)]),
    ...measuredLine(E,I0,3,[P(d.width,0),P(d.width,d.depth)]),
    isoLine(G,Q,16),isoLine(Q,I0,17),isoLine(I0,R,18)
  ];
  const breakConstruction=[
    ...measuredLine(A,V,0,[P(0,0),P(0,d.breakY)]),
    ...measuredLine(V,L,1,[S(d.breakY,0),S(d.breakY,d.lowZ)]),
    isoLine(L,K,8),isoLine(V,K,9)
  ];
  return{title:'4.1-2',problem:'求作形体的正等测图。',size:[900,650],iso:I,project3:{front:p=>F(p[0],p[2]),top:p=>P(p[0],p[1]),side:p=>S(p[1],p[2])},
    layers:[
      {id:'given-front',step:0,role:'projection',elements:givenFront},
      {id:'given-front-hidden',step:0,role:'projection-hidden',elements:givenFrontHidden},
      {id:'given-top',step:0,role:'projection',elements:givenTop},
      {id:'given-side',step:0,role:'projection',elements:givenSide},
      {id:'projection-axes',step:1,role:'axis',elements:[
        line(F(-12,0),F(d.width+12,0)),line(F(d.width,-12),F(d.width,d.height+15)),label(F(d.width,0),'o′',8,18),label(F(-12,0),'x′',-10,18),label(F(d.width,d.height+15),'z′',8,-5),
        line(P(-12,d.depth),P(d.width+12,d.depth)),line(P(d.width,d.depth+12),P(d.width,-12)),label(P(d.width,d.depth),'o',8,-8),label(P(-12,d.depth),'x',-10,-8),label(P(d.width,-12),'y',8,20),
        line(S(d.depth,-12),S(d.depth,d.height+15)),line(S(d.depth+12,0),S(-12,0)),label(S(d.depth,0),'o″',-26,18),label(S(-12,0),'y″',5,18),label(S(d.depth,d.height+15),'z″',-18,-5)
      ]},
      {id:'iso-horizontal',step:2,role:'guide',endStep:2,elements:[line([430,iO[1]],[850,iO[1]])]},
      {id:'iso-axes',step:2,role:'axis',elements:[
        line(iO,AX(185),2),line(iO,AY(130),2),line([iO[0],iO[1]+45],AZ(145),1),
        label(AX(185),'X₁',-25,18,2),label(AY(130),'Y₁',8,18,2),label(AZ(145),'Z₁',8,-8,1)
      ]},
      {id:'iso-origin',step:2,role:'axis',endStep:6,elements:[label(iO,'O₁',-31,21,1)]},
      {id:'axis-angles',step:2,role:'construction',endStep:2,elements:[
        {type:'path',d:'M'+(iO[0]-48)+','+iO[1]+' A48,48 0 0 0 '+(iO[0]-41.57)+','+(iO[1]+24),order:3},
        {type:'path',d:'M'+(iO[0]+48)+','+iO[1]+' A48,48 0 0 1 '+(iO[0]+41.57)+','+(iO[1]+24),order:3},
        label([iO[0]-63,iO[1]+38],'30°',0,0,3,true),label([iO[0]+47,iO[1]+38],'30°',0,0,3,true)
      ]},
      {id:'bottom-construction',step:3,role:'construction',endStep:6,elements:bottomConstruction},
      {id:'profile-construction',step:4,role:'construction',endStep:6,elements:profileConstruction},
      {id:'depth-construction',step:5,role:'construction',endStep:6,elements:depthConstruction},
      {id:'break-construction',step:6,role:'construction',endStep:6,elements:breakConstruction},
      {id:'final-visible',step:7,role:'answer-visible',elements:[]}
    ],
    steps:[
      {title:'读题：分析形体结构',short:'读题',action:'分析组合体的三面投影。确定形体的总长、总宽、总高，以及低台面和斜面所对应的空间位置。'},
      {title:'建立投影坐标基准',short:'投影坐标',action:'1. 在 H、V、W 面投影上确定直角坐标轴；\n2. 取底面后侧右端点为坐标原点；\n3. 令底面与 XOY 平面重合。'},
      {title:'建立正等测轴',short:'轴测轴',action:'1. 过原点 O₁ 画水平线和竖向轴 O₁Z₁；\n2. 画出与水平线成 30° 的 O₁X₁、O₁Y₁ 轴。'},

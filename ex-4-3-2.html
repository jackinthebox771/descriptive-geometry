<script>

const shapeGeometry=(()=>{
  // Relative dimensions reconstructed from the supplied undimensioned projections.
  const d={width:130,depth:130,height:128,half:65,cutX:29,lowHeight:31,cutHeight:82};
  const slope=x=>d.lowHeight+(x+d.half)*(d.cutHeight-d.lowHeight)/(d.cutX+d.half);
  const vertices={A:[0,0,0],B:[d.half,d.half,0],C:[0,d.depth,0],D:[-d.half,d.half,0],E:[d.cutX,d.cutX,0],F:[d.cutX,d.depth-d.cutX,0]};
  for(const n of ['A','C','D','E','F'])vertices[n+'t']=[...vertices[n].slice(0,2),slope(vertices[n][0])];
  for(const n of ['B','E','F'])vertices[n==='B'?'Bt':n+'h']=[...vertices[n].slice(0,2),d.height];
  return{d,vertices,slope};
})();
const solidFaces=[],solidEdges=[],edgeSeen=new Set();
const pointCode=p=>p.map(v=>v.toFixed(4)).join(','),edgeCode=pts=>pts.map(pointCode).join(';');
const V=shapeGeometry.vertices;
function addFace(names,key,name){solidFaces.push({pts:names.map(n=>V[n]),key,name})}
function addEdge(a,b,key,name){solidEdges.push({pts:[V[a],V[b]],key,name})}
addFace(['A','B','C','D'],'body','底面');
addFace(['D','A','At','Dt'],'body','后左侧面');
addFace(['C','D','Dt','Ct'],'body','前左侧面');
addFace(['A','B','Bt','Eh','Et','At'],'body','后右侧面');
addFace(['B','C','Ct','Ft','Fh','Bt'],'body','前右侧面');
addFace(['Dt','At','Et','Ft','Ct'],'slope','顶部斜面');
addFace(['Et','Eh','Fh','Ft'],'cut','竖直切口面');
addFace(['Eh','Bt','Fh'],'platform','最高平台');
for(const [a,b] of [['A','B'],['B','C'],['C','D'],['D','A'],['A','At'],['B','Bt'],['C','Ct'],['D','Dt']])addEdge(a,b,'body','柱体棱线');
for(const [a,b] of [['Dt','At'],['At','Et'],['Et','Ft'],['Ft','Ct'],['Ct','Dt']])addEdge(a,b,'slope','斜面边界');
for(const [a,b] of [['Et','Eh'],['Ft','Fh']])addEdge(a,b,'cut','切口竖棱');
for(const [a,b] of [['Eh','Bt'],['Bt','Fh'],['Fh','Eh']])addEdge(a,b,'platform','平台边界');

function makeLesson(){
  const k=1.25,a=Math.SQRT1_2/2,origin=[570,385];
  const F=(x,z)=>[190+k*x,245-k*z],P=(x,y)=>[190+k*x,325+k*y];
  const I=(x,y,z)=>[origin[0]+k*(x+a*y),origin[1]+k*(a*y-z)];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra});
  const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
  const point=(p,order)=>({type:'point',xy:I(...p),order});
  const poly=(pts,order=0,closed=false)=>({type:'path',points:pts,order,closed});
  const L=(a,b,order)=>line(I(...a),I(...b),order);
  const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
  const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
  const measured=(p,q,seq,view,aux=false)=>{
    const order=seq*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>P(r[0],r[1]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter},out=[];
    const mark=(xy,o)=>({type:'point',xy,order:o,...tmp});
    const isDepth=view==='top'&&Math.abs(q[0]-p[0])<1e-8&&Math.abs(q[1]-p[1])>1e-8;
    if(isDepth){
      out.push(line(s,t,order,tmp));let m,halfOrder;
      const direct=Math.abs(p[0])<1e-8&&Math.abs(p[1])<1e-8&&Math.abs(q[1]-shapeGeometry.d.depth)<1e-8;
      if(direct){m=P(0,shapeGeometry.d.depth/2);out.push(mark(m,order+1));halfOrder=order+2}
      else{
        const side=s[0]<190?-1:1,unit=[side*36,12],u1=[s[0]+unit[0],s[1]+unit[1]],u2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[u1[0]+t[0]-u2[0],u1[1]+t[1]-u2[1]];
        m=intersect(s,t,u1,parallel);
        const len=Math.hypot(...unit),normal=[-unit[1]/len*3.5,unit[0]/len*3.5],tick=(p,o)=>line([p[0]-normal[0],p[1]-normal[1]],[p[0]+normal[0],p[1]+normal[1]],o,tmp);
        out.push(line(s,u1,order+1,tmp),tick(u1,order+2),mark(u1,order+2),line(u1,u2,order+3,tmp),tick(u2,order+4),mark(u2,order+4));
        out.push(line(u2,t,order+5,tmp),line(u1,m,order+6,tmp),mark(m,order+7));halfOrder=order+8;
      }
      out.push(line(s,m,halfOrder,tmp),brace(s,m,8,halfOrder,removeAfter),line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
    }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
    out.push({...L(p,q,order+13),...(aux?tmp:{})});return out;
  };
  // Merge coincident and collinear projected physical edges; no independent drawing geometry.
  const projectEdges=project=>{const groups=new Map();for(const e of solidEdges){const p=project(e.pts[0]),q=project(e.pts[1]),dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);if(len<1e-8)continue;let ux=dx/len,uy=dy/len;if(ux<-1e-8||Math.abs(ux)<1e-8&&uy<0){ux=-ux;uy=-uy}const c=-uy*p[0]+ux*p[1],key=[ux,uy,c].map(v=>v.toFixed(6)).join(','),t0=ux*p[0]+uy*p[1],t1=ux*q[0]+uy*q[1];if(!groups.has(key))groups.set(key,{ux,uy,c,spans:[]});groups.get(key).spans.push([Math.min(t0,t1),Math.max(t0,t1)])}const out=[];for(const {ux,uy,c,spans} of groups.values()){spans.sort((a,b)=>a[0]-b[0]);const merged=[];for(const s of spans){const prev=merged.at(-1);if(prev&&s[0]<=prev[1]+1e-6)prev[1]=Math.max(prev[1],s[1]);else merged.push([...s])}for(const [a,b] of merged)out.push(line([ux*a-uy*c,uy*a+ux*c],[ux*b-uy*c,uy*b+ux*c]))}return out};
  const givenFront=projectEdges(p=>F(p[0],p[2])),givenPlan=projectEdges(p=>P(p[0],p[1]));
  const floor=[];let seq=0;
  const locate=(p,out)=>{const x=[p[0],0,0];if(p[0])out.push(...measured(V.A,x,seq++,'top',true));if(p[1])out.push(...measured(x,p,seq++,'top',true));out.push(point(p,seq*14-1))};
  for(const name of ['B','C','D'])locate(V[name],floor);
  for(const [u,v] of [['A','B'],['B','C'],['C','D'],['D','A']])floor.push(L(V[u],V[v],seq++*14));
  const slope=[];seq=0;
  for(const name of ['D','A','C'])slope.push(...measured(V[name],V[name+'t'],seq++,'front'));
  for(const name of ['E','F']){locate(V[name],slope);slope.push(...measured(V[name],V[name+'t'],seq++,'front'))}
  for(const [u,v] of [['Dt','At'],['At','Et'],['Et','Ft'],['Ft','Ct'],['Ct','Dt']])slope.push(L(V[u],V[v],seq++*14));
  const cap=[];seq=0;for(const [u,v] of [['Et','Eh'],['Ft','Fh'],['B','Bt']])cap.push(...measured(V[u],V[v],seq++,'front'));
  for(const [u,v] of [['Eh','Bt'],['Bt','Fh'],['Fh','Eh']])cap.push(L(V[u],V[v],seq++*14));
  return{title:'4.3-2',problem:'求作切口四棱柱的斜二测图。',size:[900,650],iso:I,project3:{front:p=>F(p[0],p[2]),top:p=>P(p[0],p[1])},layers:[
    {id:'given-front',step:0,role:'projection',elements:givenFront},{id:'given-top',step:0,role:'projection',elements:givenPlan},
    {id:'plan-center',step:0,role:'centerline',elements:[line(P(0,-7),P(0,137)),line(P(-72,65),P(72,65))]},
    {id:'projection-axes',step:1,role:'axis',elements:[line(F(-83,0),F(83,0)),line(F(0,-10),F(0,146)),text(F(0,0),'o′',-21,20),text(F(83,0),'x′',5,17),text(F(0,146),'z′',8,0),line(P(-83,0),P(83,0)),line(P(0,-10),P(0,145)),text(P(0,0),'o',-20,-7),text(P(83,0),'x',6,-6),text(P(0,145),'y',7,18)]},
    {id:'iso-axes',step:2,role:'axis',elements:[L([-115,0,0],[125,0,0],0),L([0,0,-22],[0,0,175],1),L([0,0,0],[0,190,0],2),text(I(125,0,0),'X₁',8,5,0),text(I(0,190,0),'Y₁',8,15,2),text(I(0,0,175),'Z₁',8,-8,1)]},
    {id:'iso-origin',step:2,endStep:5,role:'axis',elements:[text(origin,'O₁',-29,23,1)]},
    {id:'axis-angle',step:2,endStep:2,role:'construction',elements:[{type:'path',d:'M'+(origin[0]+42)+','+origin[1]+' A42 42 0 0 1 '+(origin[0]+42*Math.SQRT1_2)+','+(origin[1]+42*Math.SQRT1_2),order:3},text([origin[0]+50,origin[1]+24],'45°',0,0,3)]},
    {id:'bottom-construction',step:3,endStep:5,role:'construction',elements:floor},
    {id:'slope-construction',step:4,endStep:5,role:'construction',elements:slope},
    {id:'cap-construction',step:5,endStep:5,role:'construction',elements:cap},
    {id:'final-visible',step:6,role:'answer-visible',elements:[]}],steps:[
    {title:'读题：分析切口四棱柱',short:'读题',action:'分析形体的两面投影。底面为正方形，在水平投影中呈菱形；上部由斜面、竖直切口面和最高平台组成。正面投影中间的竖线是柱体棱的投影。'},
    {title:'建立投影坐标基准',short:'投影坐标',action:'1. 取底面后侧顶点为原点 O₁，以底面为 z=0；\n2. 在正面投影和水平投影中作对应坐标轴，确定各顶点的坐标。'},
    {title:'建立斜二测轴',short:'轴测轴',action:'1. 过 O₁ 画水平轴 O₁X₁和竖直轴 O₁Z₁；\n2. 画向右下方与水平轴成 45° 的 O₁Y₁；\n3. X₁、Z₁ 方向取原长，Y₁ 方向取原长的一半。'},

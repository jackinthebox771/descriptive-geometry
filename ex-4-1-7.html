<script>
const shapeGeometry=(()=>{
  const width=172,depth=130,rearDepth=48,notchHalf=50,notchRear=24,height=98,frontHalf=68,frontHeight=63,holeRadius=35,holeY=84;
  const d=Object.freeze({width,depth,rearDepth,notchHalf,notchRear,height,frontHalf,frontHeight,holeRadius,holeY});
  const circle=(z,count=72)=>Array.from({length:count},(_,i)=>{const t=2*Math.PI*i/count;return[holeRadius*Math.cos(t),holeY+holeRadius*Math.sin(t),z]});
  return{d,circle};
})();

const solidFaces=[],solidEdges=[],edgeSeen=new Set();
const pointCode=p=>p.map(v=>v.toFixed(4)).join(','),edgeCode=pts=>pts.map(pointCode).join(';');
function addFace(pts,key,name){solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=edgeCode(pts),b=edgeCode([...pts].reverse());if(edgeSeen.has(a)||edgeSeen.has(b))return;edgeSeen.add(a);edgeSeen.add(b);solidEdges.push({pts,key,name})}
function buildSolid(){buildNotchedSolid()}
function buildNotchedSolid(){
  const d=shapeGeometry.d,W=d.width/2,L=d.frontHalf,N=d.notchHalf,B=d.notchRear,Y=d.rearDepth,H=d.height,h=d.frontHeight;
  const boxes=[{x0:-W,x1:W,y0:0,y1:B,z1:H,key:'rear'},{x0:-W,x1:-N,y0:B,y1:Y,z1:H,key:'rear'},{x0:N,x1:W,y0:B,y1:Y,z1:H,key:'rear'},{x0:-L,x1:L,y0:B,y1:d.depth,z1:h,key:'front'}];
  const xs=[-W,-L,-N,N,L,W],ys=[0,B,Y,d.depth],zs=[0,h,H],owner=(i,j,k)=>{if(i<0||j<0||k<0||i>=xs.length-1||j>=ys.length-1||k>=zs.length-1)return null;const x=(xs[i]+xs[i+1])/2,y=(ys[j]+ys[j+1])/2,z=(zs[k]+zs[k+1])/2;return boxes.find(b=>x>b.x0&&x<b.x1&&y>b.y0&&y<b.y1&&z<b.z1)};
  const boundary=[],map=new Map();
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++)for(let k=0;k<zs.length-1;k++){
    const b=owner(i,j,k);if(!b)continue;const x0=xs[i],x1=xs[i+1],y0=ys[j],y1=ys[j+1],z0=zs[k],z1=zs[k+1];
    const candidates=[['x-',i-1,j,k,[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],['x+',i+1,j,k,[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]]],['y-',i,j-1,k,[[x0,y0,z0],[x0,y0,z1],[x1,y0,z1],[x1,y0,z0]]],['y+',i,j+1,k,[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],['z-',i,j,k-1,[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]]],['z+',i,j,k+1,[[x0,y0,z1],[x0,y1,z1],[x1,y1,z1],[x1,y0,z1]]]];
    for(const[n,ni,nj,nk,pts]of candidates)if(!owner(ni,nj,nk)){boundary.push({pts,n,key:b.key});if(!(b.key==='front'&&n[0]==='z'))addFace(pts,b.key,b.key==='rear'?'凹字形立板表面':'前部立方体表面')}
  }
  for(const f of boundary)for(let i=0;i<4;i++){const pts=[f.pts[i],f.pts[(i+1)%4]],a=pointCode(pts[0]),b=pointCode(pts[1]),id=a<b?a+'|'+b:b+'|'+a;if(!map.has(id))map.set(id,{pts,n:new Set(),key:f.key});map.get(id).n.add(f.n)}
  for(const e of map.values())if(new Set([...e.n].map(n=>n[0])).size>1)addEdge(e.pts,e.key,'实体棱线');
  const outline=[[-N,B],[N,B],[N,Y],[L,Y],[L,d.depth],[-L,d.depth],[-L,Y],[-N,Y]],center=[0,d.holeY],cross=(a,b)=>a[0]*b[1]-a[1]*b[0];
  const angles=[...Array.from({length:96},(_,i)=>2*Math.PI*i/96),...outline.map(p=>{let t=Math.atan2(p[1]-center[1],p[0]);return t<0?t+2*Math.PI:t})].sort((a,b)=>a-b);
  const ring=angles.map(t=>[d.holeRadius*Math.cos(t),center[1]+d.holeRadius*Math.sin(t)]),outer=angles.map(t=>{const v=[Math.cos(t),Math.sin(t)];let best=Infinity;for(let i=0;i<outline.length;i++){const a=outline[i],b=outline[(i+1)%outline.length],w=[b[0]-a[0],b[1]-a[1]],p=[a[0],a[1]-center[1]],den=cross(v,w);if(Math.abs(den)<1e-9)continue;const s=cross(p,w)/den,u=cross(p,v)/den;if(s>0&&u>=-1e-8&&u<=1+1e-8)best=Math.min(best,s)}return[best*v[0],center[1]+best*v[1]]});
  for(let i=0;i<ring.length;i++){const j=(i+1)%ring.length,p=(a,z)=>[a[0],a[1],z];for(const z of[0,h])addFace([p(ring[i],z),p(outer[i],z),p(outer[j],z),p(ring[j],z)],'front',z?'前部立方体顶面':'前部立方体底面');addFace([p(ring[i],0),p(ring[i],h),p(ring[j],h),p(ring[j],0)],'hole','圆柱通孔内壁')}
  for(const z of[0,h]){const pts=ring.map(p=>[p[0],p[1],z]);addEdge([...pts,pts[0]],'hole',z?'上孔口':'下孔口')}
}
buildSolid();

function makeLesson(){
  const d=shapeGeometry.d,W=d.width/2,L=d.frontHalf,yr=d.rearDepth,yf=d.depth,H=d.height,h=d.frontHeight,R=d.holeRadius,cy=d.holeY,q=.95,fO=[190,230],hO=[190,350],iO=[615,360],sp=1.02;
  const F=(x,z)=>[fO[0]-x*sp,fO[1]-z*sp],P=(x,y)=>[hO[0]-x*sp,hO[1]+y*sp];
  const I=(x,y,z)=>[iO[0]+q*Math.sqrt(3)/2*(-x+y),iO[1]+q*(.5*x+.5*y-z)];
  const AX=t=>I(t,0,0),AY=t=>I(0,t,0),AZ=t=>I(0,0,t);
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra}),path=(points,order=0,closed=false,extra={})=>({type:'path',points,order,closed,...extra}),point=(xy,order=0,extra={})=>({type:'point',xy,order,...extra}),label=(xy,text,dx=0,dy=0,order=0,note=false)=>({type:'text',xy,text,dx,dy,order,note});
  const isoLine=(a,b,order=0,extra={})=>line(I(...a),I(...b),order,extra),circle2=(project,z)=>path(shapeGeometry.circle(z).map(project));
  const givenFront=[path([F(-W,0),F(-W,H),F(W,H),F(W,0)],0,true),path([F(-L,0),F(-L,h),F(L,h),F(L,0)],1),line(F(-d.notchHalf,h),F(-d.notchHalf,H)),line(F(d.notchHalf,h),F(d.notchHalf,H))];
  const planOutline=[[-W,0],[W,0],[W,yr],[L,yr],[L,yf],[-L,yf],[-L,yr],[-W,yr]].map(([x,y])=>P(x,y));
  const givenTop=[path(planOutline,0,true),path([P(-W,yr),P(-d.notchHalf,yr),P(-d.notchHalf,d.notchRear),P(d.notchHalf,d.notchRear),P(d.notchHalf,yr),P(W,yr)]),circle2(p=>P(p[0],p[1]),h)];
  const givenHidden=[line(F(-R,0),F(-R,h)),line(F(R,0),F(R,h))];
  const centerLines=[line(F(0,-8),F(0,H+12)),line(P(0,cy-R-12),P(0,cy+R+12)),line(P(-R-12,cy),P(R+12,cy))];
  const brace=(a,b,offset,order,removeAfter)=>{const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,sign=Math.sign(offset||1),p=(t,n)=>[a[0]+dx*t+nx*n,a[1]+dy*t+ny*n],p0=p(0,offset),p1=p(.22,offset),p2=p(.43,offset),pm=p(.5,offset+sign*5),p3=p(.57,offset),p4=p(.78,offset),p5=p(1,offset);return{type:'path',d:'M'+p0[0]+','+p0[1]+' C'+p1[0]+','+p1[1]+' '+p2[0]+','+p2[1]+' '+pm[0]+','+pm[1]+' C'+p3[0]+','+p3[1]+' '+p4[0]+','+p4[1]+' '+p5[0]+','+p5[1],order,temporary:true,removeAfter}};
  const sourceEdge=(a,b,view='auto')=>{if(view==='top')return[P(a[0],a[1]),P(b[0],b[1])];if(view==='front')return[F(a[0],a[2]),F(b[0],b[2])];const dy=Math.abs(b[1]-a[1]);return dy>0?[P(a[0],a[1]),P(b[0],b[1])]:[F(a[0],a[2]),F(b[0],b[2])]};
  const measuredLine=(a,b,seq,view='auto')=>{const order=seq*4,removeAfter=order+3,[sa,sb]=sourceEdge(a,b,view),ia=I(...a),ib=I(...b);return[line(sa,sb,order,{temporary:true,removeAfter}),brace(sa,sb,7,order,removeAfter),line(ia,ib,order+1,{temporary:true,removeAfter}),brace(ia,ib,-8,order+1,removeAfter),isoLine(a,b,order+3)]};
  const prism=(xHalf,y0,y1,z0,z1)=>{
    const out=[],base=[0,y0,z0],rearL=[-xHalf,y0,z0],rearR=[xHalf,y0,z0],frontL=[-xHalf,y1,z0],frontR=[xHalf,y1,z0],topRearL=[-xHalf,y0,z1],topRearR=[xHalf,y0,z1],topFrontL=[-xHalf,y1,z1],topFrontR=[xHalf,y1,z1];
    let seq=0;const measure=(a,b,view)=>out.push(...measuredLine(a,b,seq++,view)),connect=(a,b)=>out.push(isoLine(a,b,seq++*4+3));
    measure(base,rearL,'top');measure(base,rearR,'top');measure(rearL,frontL,'top');measure(rearR,frontR,'top');connect(frontL,frontR);
    measure(rearL,topRearL,'front');measure(rearR,topRearR,'front');measure(frontL,topFrontL,'front');measure(frontR,topFrontR,'front');
    connect(topRearL,topRearR);connect(topRearL,topFrontL);connect(topRearR,topFrontR);connect(topFrontL,topFrontR);return out
  };
  const intersect=(a,b,c,d0)=>{const x1=a[0],y1=a[1],x2=b[0],y2=b[1],x3=c[0],y3=c[1],x4=d0[0],y4=d0[1],den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);if(Math.abs(den)<1e-9)throw Error('四心椭圆辅助线平行，无法定圆心');return[((x1*y2-y1*x2)*(x3-x4)-(x1-x2)*(x3*y4-y3*x4))/den,((x1*y2-y1*x2)*(y3-y4)-(y1-y2)*(x3*y4-y3*x4))/den]};
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const arcPoints=(c,a,b)=>{let t0=Math.atan2(a[1]-c[1],a[0]-c[0]),t1=Math.atan2(b[1]-c[1],b[0]-c[0]),dt=t1-t0;while(dt>Math.PI)dt-=2*Math.PI;while(dt<-Math.PI)dt+=2*Math.PI;const r=Math.hypot(a[0]-c[0],a[1]-c[1]);return Array.from({length:25},(_,i)=>{const t=t0+dt*i/24;return[c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)]})};
  const fourCenter=z=>{
    const raw3=[[-R,cy-R,z],[R,cy-R,z],[R,cy+R,z],[-R,cy+R,z]],raw=raw3.map(p=>I(...p));
    const acute=raw.findIndex((p,i)=>{const a=raw[(i+3)%4],b=raw[(i+1)%4];return(a[0]-p[0])*(b[0]-p[0])+(a[1]-p[1])*(b[1]-p[1])>0});
    const cyc=k=>raw[(acute+k)%4],[V0,U0,V1,U1]=[cyc(0),cyc(1),cyc(2),cyc(3)],T0=mid(V0,U0),T1=mid(U0,V1),T2=mid(V1,U1),T3=mid(U1,V0),Q0=intersect(U1,T0,V0,V1),Q1=intersect(U0,T2,V0,V1),centers=[U1,Q1,U0,Q0],ends=[[T0,T1],[T1,T2],[T2,T3],[T3,T0]],arcs=centers.map((c,i)=>arcPoints(c,ends[i][0],ends[i][1])),full=arcs.flatMap((a,i)=>i?a.slice(1):a);
    return{z,raw3,raw,V0,U0,V1,U1,T0,T1,T2,T3,Q0,Q1,centers,ends,arcs,full,center:I(0,cy,z)}

function drawModel(){modelSvg.replaceChildren();const faces=solidFaces.map((f,index)=>{const q=f.pts.map(project3);return{f,index,q,plane:screenPlane(q),depth:q.reduce((s,p)=>s+p[2],0)/q.length}});[...faces].sort((a,b)=>a.depth-b.depth).forEach(({f,index,q})=>modelSvg.append(node('polygon',{points:q.map(p=>p[0]+','+p[1]).join(' '),fill:selected?.kind==='face'&&selected.index===index?'#d65aa0':'#a8d4d0',stroke:'none','data-kind':'face','data-index':index,'aria-label':f.name})));solidEdges.forEach((e,index)=>{for(const q of visibleFragments(e.pts.map(project3),faces)){const pts=q.map(p=>p[0]+','+p[1]).join(' '),on=selected&&(selected.kind==='edge'&&selected.index===index||selected.kind==='group'&&selected.key===e.key);modelSvg.append(node('polyline',{points:pts,fill:'none',stroke:'transparent','stroke-width':12,'pointer-events':'stroke','data-kind':'edge','data-index':index,'aria-label':e.name}));modelSvg.append(node('polyline',{points:pts,fill:'none',stroke:on?'#b72a80':'#31535d','stroke-width':on?3.4:1.7,'stroke-linejoin':'round','stroke-linecap':'round','pointer-events':'none'}))}})}
function drawProjectionHighlight(){$('selectionOverlay')?.remove();if(!selected)return;const g=node('g',{id:'selectionOverlay'}),projectors=Object.values(lesson.project3);let objects=[];if(selected.kind==='edge')objects=[solidEdges[selected.index]];else if(selected.kind==='face')objects=[{pts:solidFaces[selected.index].pts,closed:true}];else objects=solidEdges.filter(e=>e.key===selected.key);for(const obj of objects)for(const project of projectors){const pts=obj.pts.map(project),d=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+(obj.closed?' Z':'');g.append(node('path',{d,class:'selection-highlight'}))}$('scene').append(g)}
function selectModel(value){selected=value;drawModel();drawProjectionHighlight();$('modelSelect').value=value?.kind==='group'?value.key:''}
modelStage.onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,yaw:modelYaw,pitch:modelPitch,kind:e.target.dataset.kind,index:Number(e.target.dataset.index)};modelMoved=false;modelStage.setPointerCapture(e.pointerId);e.preventDefault()};modelStage.onpointermove=e=>{if(!modelDrag)return;if(Math.hypot(e.clientX-modelDrag.x,e.clientY-modelDrag.y)>4)modelMoved=true;if(modelMoved){modelYaw=modelDrag.yaw+(e.clientX-modelDrag.x)*.012;modelPitch=modelDrag.pitch+(e.clientY-modelDrag.y)*.012;drawModel()}};modelStage.onpointerup=()=>{if(modelDrag&&!modelMoved&&modelDrag.kind)selectModel({kind:modelDrag.kind,index:modelDrag.index});modelDrag=null};modelStage.onpointercancel=()=>modelDrag=null;modelStage.addEventListener('wheel',e=>{e.preventDefault();modelScale=Math.max(.58,Math.min(1.55,modelScale-e.deltaY*.001));drawModel()},{passive:false});modelStage.onkeydown=e=>{const d=.14;if(e.key==='ArrowLeft')modelYaw-=d;else if(e.key==='ArrowRight')modelYaw+=d;else if(e.key==='ArrowUp')modelPitch-=d;else if(e.key==='ArrowDown')modelPitch+=d;else return;e.preventDefault();drawModel()};$('modelToggle').onclick=()=>{const show=modelStage.hidden;modelStage.hidden=!show;$('modelTools').hidden=!show;$('modelToggle').textContent=show?'隐藏模型':'显示模型';$('modelToggle').setAttribute('aria-expanded',String(show));if(show){drawModel();modelStage.focus()}else selectModel(null)};$('modelSelect').onchange=e=>selectModel(e.target.value?{kind:'group',key:e.target.value}:null);$('modelClear').onclick=()=>selectModel(null);$('modelReset').onclick=()=>{modelYaw=defaultYaw;modelPitch=defaultPitch;modelScale=1;drawModel();modelStage.focus()};
buildVisibleAnswer();drawModel();render(false);
</script>

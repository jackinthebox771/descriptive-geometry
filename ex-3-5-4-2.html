function notation(target,value,svg=false){target.replaceChildren();const re=/([PY])_([WH])/g;let start=0;for(const match of value.matchAll(re)){target.append(document.createTextNode(value.slice(start,match.index)+match[1]));const sub=svg?node('tspan',{'baseline-shift':'sub','font-size':'70%'},match[2]):document.createElement('sub');if(!svg)sub.textContent=match[2];target.append(sub);start=match.index+match[0].length}target.append(document.createTextNode(value.slice(start)))}
function element(e){let n;const p=id=>lesson.points[id];if(e.type==='line'){const a=p(e.from),b=p(e.to);n=node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})}else if(e.type==='point'){const a=p(e.at);n=node('circle',{cx:a[0],cy:a[1],r:4,class:'point'})}else if(e.type==='text'){const a=e.at?p(e.at):e.xy;n=node('text',{x:a[0]+(e.dx||0),y:a[1]+(e.dy||0),class:e.note?'note':''});notation(n,e.text,true)}else if(e.type==='path'){n=node('path',{d:e.d})}else throw Error('不支持的图形类型：'+e.type);if(e.dash)n.setAttribute('stroke-dasharray',e.dash);return n}
function view(){const [w,h]=lesson.size;$('diagram').setAttribute('viewBox',`${(w-w/zoom)/2-offset.x} ${(h-h/zoom)/2-offset.y} ${w/zoom} ${h/zoom}`);$('zoomValue').textContent=Math.round(zoom*100)+'%';$('zoomOut').disabled=zoom<=1;$('zoomIn').disabled=zoom>=2.5}
function render(animate=true){clearTimeout(visibilityBaseTimer);const s=lesson.steps[current];$('count').textContent=current===0?'准备 / 读题':`步骤 ${String(current).padStart(2,'0')} / ${String(last).padStart(2,'0')}`;for(const [id,key]of [['stepTitle','title'],['action','action'],['reason','reason'],['formula','formula']])notation($(id),s[key]||'');$('svgTitle').textContent=lesson.title+'：'+s.title;$('scene').replaceChildren();for(const pass of ['geometry','labels']){const container=node('g',{'data-pass':pass});for(const layer of lesson.layers){if(layer.step>current||(layer.endStep!==undefined&&current>layer.endStep))continue;const g=node('g',{class:(layer.role||'construction')+(layer.step===current&&current>0?' fresh':''),'data-layer':layer.id});for(const e of layer.elements){if((e.type==='text')===(pass==='labels')){const el=element(e);if(e.drawOrder!==undefined)el.dataset.drawOrder=e.drawOrder;if(e.at)el.dataset.at=e.at;g.append(el)}}container.append(g)}$('scene').append(container)}$('progress').value=current;$('progressText').textContent=`${current} / ${last}`;$('prev').disabled=current===0;$('next').disabled=current===last;[...$('steps').children].forEach((b,i)=>{if(i===current)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});view();if(current===last){$('scene').querySelectorAll('.fresh').forEach(g=>g.classList.remove('fresh'));animate=false;}animateStep(animate);retainVisibilityBase(animate);updateHighlight();updateTeaching(animate)}

let visibilityBaseTimer=null;
function retainVisibilityBase(enabled){
 if(!enabled||!drawDuration||!(lesson.visibilityBaseSteps||[]).includes(current))return;
 const base=node('g',{'data-visibility-base':String(current),class:'projection'});
 for(const layer of lesson.layers){
  if(layer.endStep!==current-1||!['projection','guide'].includes(layer.role)||!/-outside$|-undecided$/.test(layer.id))continue;
  for(const e of layer.elements){if(e.type==='line'||e.type==='path')base.append(element(e))}
 }
 if(!base.children.length)return;
 $('scene').prepend(base);
 visibilityBaseTimer=setTimeout(()=>{base.remove();visibilityBaseTimer=null},drawDuration+100);
}
let drawDuration=0;
function animateStep(enabled){
 drawDuration=0;if(!lesson.animateConstruction||!enabled||current===0||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const fresh=[...$('scene').querySelectorAll('g.fresh')];fresh.forEach(g=>g.style.animation='none');
 const lines=fresh.flatMap(g=>[...g.children].filter(n=>n.tagName==='line'));
 lines.sort((a,b)=>Number(a.dataset.drawOrder??999)-Number(b.dataset.drawOrder??999));
 const duration=330,gap=90,ends=new Map(),defs=node('defs');$('scene').prepend(defs);
 lines.forEach((n,i)=>{
  const delay=i*(duration+gap),len=n.getTotalLength();if(!len)return;
  const id='draw-mask-'+current+'-'+i;
  const mask=node('mask',{id,maskUnits:'userSpaceOnUse',x:-100,y:-100,width:lesson.size[0]+200,height:lesson.size[1]+200});
  const path=node('path',{d:`M ${n.getAttribute('x1')} ${n.getAttribute('y1')} L ${n.getAttribute('x2')} ${n.getAttribute('y2')}`});
  path.style.cssText=`vector-effect:none;fill:none;stroke:white;stroke-width:20;stroke-dasharray:${len};stroke-dashoffset:${len}`;
  mask.append(path);defs.append(mask);n.setAttribute('mask',`url(#${id})`);
  n.animate([{opacity:0},{opacity:1}],{duration:1,delay,fill:'both'});
  path.animate([{strokeDashoffset:String(len)},{strokeDashoffset:'0'}],{duration,delay,fill:'both',easing:'linear'}).finished.then(()=>n.removeAttribute('mask')).catch(()=>{});
  const key=n.getAttribute('x2')+','+n.getAttribute('y2');ends.set(key,Math.max(ends.get(key)||0,delay+duration));
 });
 drawDuration=lines.length?(lines.length-1)*(duration+gap)+duration:0;
 fresh.flatMap(g=>[...g.children].filter(n=>n.tagName==='text'||n.tagName==='circle')).forEach(n=>{
  const at=n.dataset.at,p=at&&lesson.points[at];let delay=drawDuration;
  if(p&&ends.has(p.join(',')))delay=ends.get(p.join(','));
  if(current===1&&at&&/^[cdeab]w$/.test(at))delay=('cdeab'.indexOf(at[0])*3+2)*(duration+gap)+duration;
  n.animate([{opacity:0},{opacity:1}],{duration:100,delay,fill:'both'});
 });
}

function stop(){clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false')}
function go(i,animate=true){stop();current=Math.max(0,Math.min(last,i));render(animate)}
function play(){if(timer){stop();return}if(current===last){current=0;render()}$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');function schedule(){timer=setTimeout(()=>{current++;render();if(current>=last){timer=setTimeout(stop,drawDuration+150)}else schedule()},Math.max(Number($('speed').value),drawDuration+750))}schedule()}

document.title=lesson.title;$('title').textContent='【'+lesson.title+'】 '+lesson.problem;$('progress').max=last;
lesson.steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step-button';notation(b,`${i===0?'准备':String(i).padStart(2,'0')} ${s.short||s.title}`);b.onclick=()=>go(i);$('steps').append(b)});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>go(last,false);$('restart').onclick=()=>{zoom=1;offset={x:0,y:0};go(0)};$('play').onclick=play;$('speed').onchange=()=>{if(timer){stop();play()}};$('progress').oninput=e=>go(+e.target.value);
$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);view()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.25);if(zoom===1)offset={x:0,y:0};view()};$('fit').onclick=()=>{zoom=1;offset={x:0,y:0};view()};
$('canvas').onpointerdown=e=>{if(zoom===1)return;drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};$('canvas').setPointerCapture(e.pointerId)};$('canvas').onpointermove=e=>{if(!drag)return;const r=$('diagram').getBoundingClientRect(),scale=Math.min(r.width/(lesson.size[0]/zoom),r.height/(lesson.size[1]/zoom));offset={x:drag.ox+(e.clientX-drag.x)/scale,y:drag.oy+(e.clientY-drag.y)/scale};view()};$('canvas').onpointerup=$('canvas').onpointercancel=()=>drag=null;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch{$('status').textContent='当前浏览器不支持网页全屏，可以使用浏览器的全屏功能。'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.code==='Space'){e.preventDefault();play()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script><script>// Keep drawing and model in the same workspace.
document.querySelector('.workspace').append(document.querySelector('.model-panel'));
// All linked views use these same three-dimensional face coordinates.
const faces=[];
function face(name,vertices){faces.push({name,vertices,id:faces.length})}
const geometry=lesson.geometry;
geometry.forEach(f=>face(f.name,f.vertices));
const normals=geometry.map(f=>f.normal),[L,D,T]=lesson.modelSize,S=lesson.projectionScale;
let selected=null,az=.35,el=.52,modelScale=1,modelDrag=null;
function rotated(p){const x=p[0]-L/2,y=p[1]-D/2,z=p[2]-T/2;const a=x*Math.cos(az)+y*Math.sin(az),b=-x*Math.sin(az)+y*Math.cos(az);return [a,b*Math.sin(el)-z*Math.cos(el),b*Math.cos(el)+z*Math.sin(el)]}
function projectModel(p){const q=rotated(p);return [310+q[0]*Math.min(1.5,430/(L+D),255/T)*modelScale,175+q[1]*Math.min(1.5,430/(L+D),255/T)*modelScale,q[2]]}
function pathD(ps){return ps.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+' Z'}
function choose(s){selected=s;$('faceSelect').value=s?.kind==='face'?s.id:'';$('modelSelection').textContent=s?(s.kind==='face'?'已选面：':'已选棱线：')+s.name:'尚未选择线或面';drawModel();updateHighlight()}
function updateHighlight(){
 $('scene').querySelector('.selection-overlay')?.remove();
 if(!selected||$('modelContent').hidden)return;
 $('scene').append(projectionOverlay(selected,'selection-overlay'));
}
function projectionOverlay(selected,className){
 const g=node('g',{class:className,'aria-label':'空间对象的三个对应投影'});
 const transforms=[p=>[95+S*p[0],245-S*p[2]],p=>[485+S*p[1],245-S*p[2]],p=>[95+S*p[0],345+S*p[1]]];
 const actual=lesson.actualProjections;
 for(const [view,fn] of transforms.entries()){
  const ps=selected.vertices.map(fn),vg=node('g',{'data-view':view});g.append(vg);
  const ptkey=p=>p.map(v=>Math.round(v*10000)/10000).join(',');
  const unique=[...new Map(ps.map(p=>[ptkey(p),p])).values()];
  vg.dataset.shape=unique.map(ptkey).sort().join('|');
  if(unique.length===1){vg.append(node('circle',{cx:ps[0][0],cy:ps[0][1],r:5}));continue}
  if(selected.kind==='face')vg.append(node('path',{d:pathD(ps),style:'stroke:none','data-face-tint':'true'}));
  const seen=new Set(),count=selected.kind==='edge'?1:ps.length;
  for(let i=0;i<count;i++){
   const a=ps[i],b=ps[(i+1)%ps.length],dx=b[0]-a[0],dy=b[1]-a[1],len2=dx*dx+dy*dy;
   if(len2<.000001)continue;
   const collinear=p=>Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)<.02;
   // Split face boundaries at visibility changes; never cover a dashed segment
   // with a single solid face outline. Coincident visible geometry has priority.
   for(const e of actual){
    if(!collinear(e.a)||!collinear(e.b))continue;
    const ts=[e.a,e.b].map(p=>((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len2).sort((x,y)=>x-y);
    const lo=Math.max(0,ts[0]),hi=Math.min(1,ts[1]);if(hi-lo<.00001)continue;
    const c=[a[0]+lo*dx,a[1]+lo*dy],d=[a[0]+hi*dx,a[1]+hi*dy];
    const key=[ptkey(c),ptkey(d)].sort().join('|')+'|'+e.hidden;
    if(seen.has(key))continue;seen.add(key);
    vg.append(node('path',{d:`M${c} L${d}`,style:'fill:none','stroke-dasharray':e.hidden?'8 6':'none','data-visibility':e.hidden?'hidden':'visible'}));
   }
  }
 }
 return g;
}
let teachingTimer=null,teachingEpoch=0;
function updateTeaching(animate){
 clearTimeout(teachingTimer);const epoch=++teachingEpoch;
 $('scene').querySelector('.teaching-overlay')?.remove();
 const ids=lesson.teaching[current];if(!ids)return;
 const group=node('g',{class:'teaching-overlay'}),seen=new Set();
 for(const id of ids){
  const f=faces[id],part=projectionOverlay({kind:'face',vertices:f.vertices},'teaching-face');
  for(const view of [...part.children]){
   const key=view.dataset.view+'|'+view.dataset.shape;
   if(seen.has(key))view.remove();else seen.add(key);
  }
  group.append(part);
 }
 const pending=lesson.targetViews.flatMap(v=>[...group.querySelectorAll(`[data-view="${v}"]`)]);
 const delayed=animate&&drawDuration>0;
 if(delayed)pending.forEach(n=>n.style.display='none');
 $('scene').insertBefore(group,$('scene').querySelector('.selection-overlay'));
 if(delayed&&lesson.earlyTeaching?.step===current){
   const config=lesson.earlyTeaching;
   const edge=$('scene').querySelector(`.fresh.answer line[data-draw-order="${config.lastOrder}"]`);
   const maskId=edge?.getAttribute('mask')?.match(/#([^)]*)/)?.[1];
   const animation=maskId&&document.getElementById(maskId)?.querySelector('path')?.getAnimations()[0];
   animation?.finished.then(()=>{
    if(epoch!==teachingEpoch||!group.isConnected)return;
    group.querySelectorAll(`[data-view="${config.view}"]`).forEach(n=>n.style.display='');
   }).catch(()=>{});
  }
  if(delayed)teachingTimer=setTimeout(()=>{
  if(epoch!==teachingEpoch||!group.isConnected)return;
  pending.forEach(n=>n.style.display='');
 },drawDuration+40);
}
function drawModel(){
 $('model').replaceChildren();
 const camera=[-Math.sin(az)*Math.cos(el),Math.cos(az)*Math.cos(el),Math.sin(el)];
 // Draw only outward-facing surfaces, then depth-sort to respect occlusion.
 const visible=faces.filter(f=>normals[f.id].reduce((v,n,i)=>v+n*camera[i],0)>0.00001);
 visible.sort((a,b)=>a.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/a.vertices.length-b.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/b.vertices.length);
 for(const f of visible){const ps=f.vertices.map(projectModel),g=node('g',{'data-face':f.id});
 const shape=node('path',{d:pathD(ps),fill:selected?.kind==='face'&&selected.id===f.id?'#e6a0cb':['#b7d8df','#a5c9d4','#d1e7e9'][f.id%3],stroke:'#446570','stroke-width':1.6,tabindex:0,role:'button','aria-label':f.name});
 shape.dataset.face=f.id;shape.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}};g.append(shape);
 f.vertices.forEach((a,i)=>{const b=f.vertices[(i+1)%f.vertices.length],pa=ps[i],pb=ps[(i+1)%ps.length];const hit=node('line',{x1:pa[0],y1:pa[1],x2:pb[0],y2:pb[1],stroke:'transparent','stroke-width':12,'data-edge':i,'data-face':f.id});g.append(hit)});
 $('model').append(g);
 }
 if(selected?.kind==='edge'){
  const [a,b]=selected.vertices.map(projectModel);$('model').append(node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#b72a80','stroke-width':4,'pointer-events':'none'}));
 }
 $('modelMinus').disabled=modelScale<=.6;$('modelPlus').disabled=modelScale>=1.7;
}
faces.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.name;$('faceSelect').append(o)});
$('faceSelect').onchange=e=>{if(e.target.value===''){choose(null);return}const f=faces[+e.target.value];choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})};
$('toggleModel').onclick=()=>{const hidden=!$('modelContent').hidden;$('modelContent').hidden=hidden;document.querySelector('.workspace').classList.toggle('model-open',!hidden);$('toggleModel').textContent=hidden?'显示 3D 模型':'隐藏 3D 模型';$('toggleModel').setAttribute('aria-expanded',!hidden);drawModel();updateHighlight()};
function modelZoom(delta){modelScale=Math.min(1.7,Math.max(.6,modelScale+delta));drawModel()}
$('modelMinus').onclick=()=>modelZoom(-.1);$('modelPlus').onclick=()=>modelZoom(.1);
$('modelReset').onclick=()=>{az=.35;el=.52;modelScale=1;drawModel()};$('clearSelection').onclick=()=>choose(null);
$('model').addEventListener('wheel',e=>{e.preventDefault();modelZoom(e.deltaY>0?-.08:.08)},{passive:false});
$('model').onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,az,el,target:e.target,moved:false};$('model').setPointerCapture(e.pointerId)};
$('model').onpointermove=e=>{if(!modelDrag)return;const dx=e.clientX-modelDrag.x,dy=e.clientY-modelDrag.y;if(Math.hypot(dx,dy)>4)modelDrag.moved=true;if(modelDrag.moved){az=modelDrag.az+dx*.009;el=Math.min(1.5,Math.max(-1.5,modelDrag.el+dy*.009));drawModel()}};
$('model').onpointerup=e=>{if(!modelDrag)return;const d=modelDrag;modelDrag=null;if(d.moved)return;const t=d.target;if(t.dataset.face!==undefined){const f=faces[+t.dataset.face];if(t.dataset.edge!==undefined){const i=+t.dataset.edge;choose({kind:'edge',name:f.name+'的棱线',vertices:[f.vertices[i],f.vertices[(i+1)%f.vertices.length]]})}else choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}else choose(null)};
$('model').onpointercancel=()=>modelDrag=null;
$('exercisePicker').onchange=e=>location.href='作业3.5-4('+e.target.value+').html';
render();drawModel();
</script></body></html>

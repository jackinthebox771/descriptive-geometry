window.updateLinked=link;
function choose(id){selected=id;$('selectObject').value=id;$('modelSelection').textContent=id?(P[id]?'点 '+id.toUpperCase()+'：紫色圆环定位三投影，括号仍表示不可见。':id==='end'?'端面：W 面为圆，V、H 面积聚成线。':'端面圆周：W 面为圆，V、H 面积聚成线。'):'拖动旋转 · 滚轮缩放 · 点击选择';draw();link()}
$('toggleModel').onclick=()=>{const open=$('modelContent').hidden;$('modelContent').hidden=!open;document.querySelector('.workspace').classList.toggle('model-open',open);$('toggleModel').textContent=open?'隐藏 3D 模型':'显示 3D 模型';$('toggleModel').setAttribute('aria-expanded',open);if(!open)choose('');draw();link()};
$('selectObject').onchange=e=>choose(e.target.value);$('clearSelection').onclick=()=>choose('');$('modelPlus').onclick=()=>{scale=Math.min(1.8,scale+.15);draw()};$('modelMinus').onclick=()=>{scale=Math.max(.5,scale-.15);draw()};$('modelReset').onclick=()=>{yaw=-.65;pitch=.45;scale=1;draw()};
model.onpointerdown=e=>{dragging={x:e.clientX,y:e.clientY,yaw,pitch,pick:e.target.dataset.pick,moved:false};model.setPointerCapture(e.pointerId)};
model.onpointermove=e=>{if(!dragging)return;let dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;if(Math.hypot(dx,dy)>4)dragging.moved=true;if(dragging.moved){yaw=dragging.yaw+dx*.01;pitch=Math.max(-1.4,Math.min(1.4,dragging.pitch+dy*.01));draw()}};
model.onpointerup=()=>{if(dragging&&!dragging.moved&&dragging.pick)choose(dragging.pick);dragging=null};model.onpointercancel=()=>dragging=null;model.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(1.8,scale-e.deltaY*.001));draw()};draw();
})();

</script></body></html>

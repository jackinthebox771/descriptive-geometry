<script>


const shapeGeometry=(()=>{
 const d={width:220,depth:102,lowerHeight:16,upperHeight:33,upperLeft:31,
   archCenter:125,outerRadius:54,innerRadius:31,archDepth:51,springRise:70};
 d.spring=d.upperHeight+d.springRise;
 d.archTop=d.spring+d.outerRadius;
 d.outerLeft=d.archCenter-d.outerRadius;d.outerRight=d.archCenter+d.outerRadius;
 d.innerLeft=d.archCenter-d.innerRadius;d.innerRight=d.archCenter+d.innerRadius;
 const circle=(radius,y,n=64)=>Array.from({length:n+1},(_,i)=>{
  const t=Math.PI*i/n;return[d.archCenter+radius*Math.cos(t),y,d.spring+radius*Math.sin(t)];
 });
 return{d,circle};
})();
const d=shapeGeometry.d,solidFaces=[],solidEdges=[],edgeSeen=new Set();
const V=(x,y,z)=>[x,y,z],W=d.width,D=d.depth,H=d.lowerHeight,U=d.upperHeight,UL=d.upperLeft,
  A=d.archDepth,C=d.archCenter,OL=d.outerLeft,OR=d.outerRight,IL=d.innerLeft,IR=d.innerRight,S=d.spring;
function addFace(pts,key,name){if(pts.length>=3)solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=pts[0],b=pts.at(-1),id=[a,b].map(p=>p.map(v=>v.toFixed(6)).join(',')).sort().join(';');
 if(edgeSeen.has(id))return;edgeSeen.add(id);solidEdges.push({pts,key,name})}
const E=(a,b,key,name)=>addEdge([a,b],key,name);
// One connected stepped base: the left recess is a change of top height, not a second block.
addFace([V(0,0,0),V(W,0,0),V(W,D,0),V(0,D,0)],'base','底板底面');
addFace([V(0,0,0),V(0,D,0),V(0,D,H),V(0,0,H)],'base','底板左侧面');
addFace([V(0,D,0),V(W,D,0),V(W,D,H),V(0,D,H)],'base','底板前下表面');
addFace([V(0,0,0),V(W,0,0),V(W,0,H),V(0,0,H)],'base','底板后下表面');
addFace([V(W,0,0),V(W,D,0),V(W,D,U),V(W,0,U)],'base','底板右侧完整平面');
addFace([V(0,0,H),V(UL,0,H),V(UL,D,H),V(0,D,H)],'base','底板左侧台阶面');
addFace([V(UL,0,H),V(UL,D,H),V(UL,D,U),V(UL,0,U)],'base','底板台阶竖面');
addFace([V(UL,D,H),V(W,D,H),V(W,D,U),V(UL,D,U)],'base','底板前上表面');
addFace([V(UL,0,H),V(W,0,H),V(W,0,U),V(UL,0,U)],'base','底板后上表面');
addFace([V(UL,0,U),V(W,0,U),V(W,D,U),V(UL,D,U)],'base','底板主顶面');
// Annular front/rear end faces, vertical opening walls, and smooth cylindrical shells.
const outer0=shapeGeometry.circle(d.outerRadius,0),outerA=shapeGeometry.circle(d.outerRadius,A),
  inner0=shapeGeometry.circle(d.innerRadius,0),innerA=shapeGeometry.circle(d.innerRadius,A);
for(const y of [0,A]){
 addFace([V(OL,y,U),V(IL,y,U),V(IL,y,S),V(OL,y,S)],'plate','立板左端面');
 addFace([V(IR,y,U),V(OR,y,U),V(OR,y,S),V(IR,y,S)],'plate','立板右端面');
 const o=y===0?outer0:outerA,i=y===0?inner0:innerA;
 for(let j=0;j<o.length-1;j++)addFace([o[j],o[j+1],i[j+1],i[j]],'plate','立板半圆环端面');
}
for(const x of [OL,OR])addFace([V(x,0,U),V(x,A,U),V(x,A,S),V(x,0,S)],'plate','立板外侧直壁');
for(const x of [IL,IR])addFace([V(x,0,U),V(x,A,U),V(x,A,S),V(x,0,S)],'hole','贯通孔侧壁');
for(let j=0;j<outer0.length-1;j++){
 addFace([outer0[j],outerA[j],outerA[j+1],outer0[j+1]],'plate','外半圆柱面');
 addFace([inner0[j],innerA[j],innerA[j+1],inner0[j+1]],'hole','内半圆柱面');
}
// Only physical outline and intersection edges, not longitudinal tangent or mesh lines.
for(const [a,b] of [[V(0,0,0),V(W,0,0)],[V(W,0,0),V(W,D,0)],
[V(W,D,0),V(0,D,0)],[V(0,D,0),V(0,0,0)]])E(a,b,'base','底板下棱');
for(const y of [0,D]){
 E(V(0,y,0),V(0,y,H),'base','底板左竖棱');
 E(V(W,y,0),V(W,y,U),'base','底板右竖棱');
 E(V(0,y,H),V(UL,y,H),'base','左侧台阶边界');
 E(V(UL,y,H),V(UL,y,U),'base','台阶竖棱');
 E(V(UL,y,U),V(W,y,U),'base','底板上端顶棱');
}
E(V(0,0,H),V(0,D,H),'base','左侧台阶纵棱');
for(const z of [H,U])E(V(UL,0,z),V(UL,D,z),'base','台阶转折纵棱');
E(V(W,0,U),V(W,D,U),'base','底板右侧顶棱');
for(const y of [0,A]){
 for(const x of [OL,IL,IR,OR])E(V(x,y,U),V(x,y,S),x===IL||x===IR?'hole':'plate','立板端面竖边');
 addEdge(y===0?outer0:outerA,'plate','外半圆端缘');
 addEdge(y===0?inner0:innerA,'hole','内半圆孔缘');
 for(const [x0,x1] of [[OL,IL],[IR,OR]])E(V(x0,y,U),V(x1,y,U),'plate','立板足部交界');
}
for(const x of [OL,IL,IR,OR])E(V(x,0,U),V(x,A,U),x===IL||x===IR?'hole':'plate','立板与底板交线');
// View-dependent tangent generators of the two smooth half-cylinders.
// They are drawing contours, not physical edges of the rotatable model.
const tangentAngle=Math.PI/4;
const apparentTangents=[d.outerRadius,d.innerRadius].map(r=>[
 V(C+r*Math.cos(tangentAngle),0,S+r*Math.sin(tangentAngle)),
 V(C+r*Math.cos(tangentAngle),A,S+r*Math.sin(tangentAngle))]);

function makeLesson(){
 const k=1.10,a=Math.SQRT1_2/2,origin=[830,512];
 const F=(x,z)=>[100+1.2*x,290-1.2*z],P=(x,y)=>[100+1.2*x,360+1.2*y];
 const I=(x,y,z)=>[origin[0]+k*(x-W+a*y),origin[1]+k*(a*y-z)];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra});
  const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
  const point=(p,order)=>({type:'point',xy:I(...p),order});
  const poly=(pts,order=0,closed=false)=>({type:'path',points:pts,order,closed});
  const L=(a,b,order)=>line(I(...a),I(...b),order);
  const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
  const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
  const measured=(p,q,seq,view,aux=false)=>{
    const order=seq*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>P(r[0],r[1]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter},out=[];
    const mark=(xy,o)=>({type:'point',xy,order:o,...tmp});
    const isDepth=view==='top'&&Math.abs(q[0]-p[0])<1e-8&&Math.abs(q[1]-p[1])>1e-8;
    if(isDepth){
      out.push(line(s,t,order,tmp));let m,halfOrder;
      const direct=Math.abs(p[1])<1e-8&&Math.abs(q[1]-shapeGeometry.d.depth)<1e-8;
      if(direct){m=P(p[0],shapeGeometry.d.depth/2);out.push(mark(m,order+1));halfOrder=order+2}
      else{
        const side=s[0]<270?-1:1,unit=[side*36,12],u1=[s[0]+unit[0],s[1]+unit[1]],u2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[u1[0]+t[0]-u2[0],u1[1]+t[1]-u2[1]];
        m=intersect(s,t,u1,parallel);
        const len=Math.hypot(...unit),normal=[-unit[1]/len*3.5,unit[0]/len*3.5],tick=(p,o)=>line([p[0]-normal[0],p[1]-normal[1]],[p[0]+normal[0],p[1]+normal[1]],o,tmp);
        out.push(line(s,u1,order+1,tmp),tick(u1,order+2),mark(u1,order+2),line(u1,u2,order+3,tmp),tick(u2,order+4),mark(u2,order+4));
        out.push(line(u2,t,order+5,tmp),line(u1,m,order+6,tmp),mark(m,order+7));halfOrder=order+8;
      }
      out.push(line(s,m,halfOrder,tmp),brace(s,m,8,halfOrder,removeAfter),line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
    }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
    out.push({...L(p,q,order+13),...(aux?tmp:{})});return out;
  };

 const givenFront=[],givenPlan=[],givenHidden=[];
 const fl=(x0,z0,x1,z1)=>givenFront.push(line(F(x0,z0),F(x1,z1)));
 const pl=(x0,y0,x1,y1,hidden=false)=>(hidden?givenHidden:givenPlan).push(line(P(x0,y0),P(x1,y1)));
 const arc=(radius,y,project,order=0)=>({type:'path',points:shapeGeometry.circle(radius,y).map(project),order});
 // Both given views are derived from the spatial dimensions and the same two circles.
 fl(0,0,W,0);fl(0,0,0,H);fl(0,H,UL,H);fl(UL,H,UL,U);fl(UL,U,W,U);fl(W,0,W,U);
 for(const x of [OL,OR,IL,IR])fl(x,U,x,S);
 givenFront.push(arc(d.outerRadius,0,p=>F(p[0],p[2])));
 givenFront.push(arc(d.innerRadius,0,p=>F(p[0],p[2])));
 pl(0,0,W,0);pl(W,0,W,D);pl(W,D,0,D);pl(0,D,0,0);
 pl(UL,0,UL,D);pl(OL,0,OL,A);pl(OR,0,OR,A);pl(OL,A,OR,A);
 pl(IL,0,IL,A,true);pl(IR,0,IR,A,true);
 const center=[line(F(C,-6),F(C,d.archTop+8)),line(F(OL-8,S),F(OR+8,S)),
  line(P(C,-7),P(C,D+8))];
 let seq=0;const base=[],rear=[],front=[],measuredDepths=new Set();
 const measure=(out,p,q,view,aux=false)=>{
  const depth=view==='top'&&Math.abs(p[0]-q[0])<1e-8&&Math.abs(p[1]-q[1])>1e-8;
  if(depth){const length=Math.abs(p[1]-q[1]).toFixed(6);if(measuredDepths.has(length)){
   const order=seq++*14,tmp={temporary:true,removeAfter:order+13},s=P(p[0],p[1]),t=P(q[0],q[1]),m=[(s[0]+t[0])/2,(s[1]+t[1])/2],u=I(...p),v=I(...q);
   out.push(line(s,t,order,tmp),{type:'point',xy:m,order:order+1,...tmp},line(s,m,order+2,tmp),brace(s,m,8,order+2,order+13),line(u,v,order+4,tmp),brace(u,v,-8,order+4,order+13));
   const e=L(p,q,order+13);out.push(aux?{...e,...tmp}:e);return;
  }measuredDepths.add(length)}
  out.push(...measured(p,q,seq++,view,aux));

function selectModel(value){selected=value;drawModel();drawProjectionHighlight();$('modelSelect').value=value?.kind==='group'?value.key:''}
modelStage.onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,yaw:modelYaw,pitch:modelPitch,kind:e.target.dataset.kind,index:Number(e.target.dataset.index)};modelMoved=false;modelStage.setPointerCapture(e.pointerId);e.preventDefault()};modelStage.onpointermove=e=>{if(!modelDrag)return;if(Math.hypot(e.clientX-modelDrag.x,e.clientY-modelDrag.y)>4)modelMoved=true;if(modelMoved){modelYaw=modelDrag.yaw+(e.clientX-modelDrag.x)*.012;modelPitch=modelDrag.pitch+(e.clientY-modelDrag.y)*.012;drawModel()}};modelStage.onpointerup=()=>{if(modelDrag&&!modelMoved&&modelDrag.kind)selectModel({kind:modelDrag.kind,index:modelDrag.index});modelDrag=null};modelStage.onpointercancel=()=>modelDrag=null;modelStage.addEventListener('wheel',e=>{e.preventDefault();modelScale=Math.max(.58,Math.min(1.55,modelScale-e.deltaY*.001));drawModel()},{passive:false});modelStage.onkeydown=e=>{const d=.14;if(e.key==='ArrowLeft')modelYaw-=d;else if(e.key==='ArrowRight')modelYaw+=d;else if(e.key==='ArrowUp')modelPitch-=d;else if(e.key==='ArrowDown')modelPitch+=d;else return;e.preventDefault();drawModel()};$('modelToggle').onclick=()=>{const show=modelStage.hidden;modelStage.hidden=!show;$('modelTools').hidden=!show;$('modelToggle').textContent=show?'隐藏模型':'显示模型';$('modelToggle').setAttribute('aria-expanded',String(show));if(show){drawModel();modelStage.focus()}else selectModel(null)};$('modelSelect').onchange=e=>selectModel(e.target.value?{kind:'group',key:e.target.value}:null);$('modelClear').onclick=()=>selectModel(null);$('modelReset').onclick=()=>{modelYaw=defaultYaw;modelPitch=defaultPitch;modelScale=1;drawModel();modelStage.focus()};
buildVisibleAnswer();drawModel();render(false);
</script>

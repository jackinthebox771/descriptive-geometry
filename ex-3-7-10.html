$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch{$('status').textContent='当前浏览器不支持网页全屏，可以使用浏览器的全屏功能。'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','SUMMARY'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.code==='Space'){e.preventDefault();play()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});render();
</script><script>(()=>{
let yaw=-.65,pitch=.45,scale=1,selected='',dragging=null;
const model=$('model'),P=lesson.spatialPoints;
function project([x,y,z]){z-=95;const u=x*Math.cos(yaw)-y*Math.sin(yaw),v=x*Math.sin(yaw)+y*Math.cos(yaw);return [210+u*.8*scale,106-(z*Math.cos(pitch)-v*Math.sin(pitch))*.8*scale,v*Math.cos(pitch)+z*Math.sin(pitch)]}
function normal(p){const r=Math.hypot(p[0],p[1]);return (p[0]/r*Math.sin(yaw)+p[1]/r*Math.cos(yaw))*Math.cos(pitch)+(90/195)*Math.sin(pitch)}
const ring=Array.from({length:97},(_,i)=>[90*Math.cos(i*Math.PI/48),90*Math.sin(i*Math.PI/48),0]);
function draw(){model.replaceChildren();let faces=[];for(let i=0;i<96;i++)faces.push({p:[[0,0,195],ring[i],ring[i+1]],id:'side',n:normal(ring[i])});faces.push({p:ring,id:'base',n:-1});faces.map(f=>({...f,q:f.p.map(project)})).sort((a,b)=>a.q.reduce((s,p)=>s+p[2],0)/a.q.length-b.q.reduce((s,p)=>s+p[2],0)/b.q.length).forEach(f=>{const d='M'+f.q.map(p=>p.slice(0,2).join(',')).join('L')+'Z';const light=Math.round(76+7*f.n);const color=selected===f.id?'#e7a6d0':f.id==='side'?`hsl(177,28%,${light}%)`:'#d8e8e8';const el=node('path',{d,fill:color,stroke:color,'stroke-width':.5});el.dataset.pick=f.id==='side'?'side':'rim';model.append(el)});
for(let i=0;i<96;i++){const a=project(ring[i]),b=project(ring[i+1]);const hidden=pitch>0&&normal(ring[i])<0;const el=node('path',{d:`M${a[0]},${a[1]}L${b[0]},${b[1]}`,fill:'none',stroke:selected==='rim'?'#b72a80':'#487f82','stroke-width':selected==='rim'?3:1.4});if(hidden){if(i%4>1)continue;el.setAttribute('opacity','.5')}el.dataset.pick='rim';model.append(el)}
Object.entries(lesson.spatialCurves).forEach(([id,ps])=>{for(let i=1;i<ps.length;i++){const p=ps[i],hidden=normal(p)<0;if(hidden&&selected!==id)continue;const a=project(ps[i-1]),b=project(p);const el=node('path',{d:`M${a[0]},${a[1]}L${b[0]},${b[1]}`,fill:'none',stroke:selected===id?'#b72a80':id==='ab'?'#dd663c':'#0864c9','stroke-width':3});if(hidden){el.setAttribute('opacity','.4');if(i%8>3)continue}el.dataset.pick=id;model.append(el)}});
Object.entries(P).forEach(([id,p])=>{const hidden=normal(p)<0;if(hidden&&selected!==id)return;const q=project(p);const c=node('circle',{cx:q[0],cy:q[1],r:selected===id?6:4,fill:hidden?'white':selected===id?'#b72a80':'#dd663c',stroke:hidden?'#b72a80':'white','stroke-width':1.5});if(hidden)c.setAttribute('stroke-dasharray','2 2');c.dataset.pick=id;model.append(c);model.append(node('text',{x:q[0]+9,y:q[1]-8,style:'font:15px Georgia;fill:#173f47;stroke:none'},hidden?'('+id.toUpperCase()+')':id.toUpperCase()))});}
function link(){document.querySelectorAll('.selection-overlay').forEach(e=>e.remove());if(!selected||$('modelContent').hidden)return;const g=node('g',{class:'selection-overlay'});if(lesson.curvePaths[selected]){Object.values(lesson.curvePaths[selected]).flat().forEach(e=>{const n=node('path',{d:e.d,style:'fill:none'});if(e.dash)n.setAttribute('stroke-dasharray',e.dash);g.append(n)})}else if(P[selected]){const [x,y,z]=P[selected];[[205+x,265-z],[500+y,265-z],[205+x,435+y]].forEach((p,i)=>{const hidden=(i===0&&y<0)||(i===1&&x>0);const c=node('circle',{cx:p[0],cy:p[1],r:8});if(hidden)c.setAttribute('stroke-dasharray','3 3');g.append(c)})}else{const fill=selected==='side'?'#e346a32b':'none';g.append(node('path',{d:selected==='side'?'M205 70L115 265H295ZM500 70L410 265H590Z':'M115 265H295M410 265H590',style:'fill:'+fill}));g.append(node('path',{d:'M295 435A90 90 0 1 0 115 435A90 90 0 1 0 295 435',style:'fill:'+fill}))}$('scene').append(g)}
window.updateLinked=link;
function choose(id){selected=id;$('selectObject').value=id;$('modelSelection').textContent=id?(P[id]?'点 '+id.toUpperCase()+'：紫色圈对应三投影；模型背面选点用虚圈示意。':lesson.spatialCurves[id]?'曲线 '+id.toUpperCase()+'：三面同步高亮，保留虚实线；CD 的侧投影重合处实线优先。':id==='side'?'圆锥侧面：轮廓随观察方向改变，不是实体棱线。':'底圆：V、W 积聚为底边；H 面反映实形。'):'拖动旋转 · 滚轮缩放 · 点击选择';draw();link()}
$('toggleModel').onclick=()=>{const open=$('modelContent').hidden;$('modelContent').hidden=!open;document.querySelector('.workspace').classList.toggle('model-open',open);$('toggleModel').textContent=open?'隐藏 3D 模型':'显示 3D 模型';$('toggleModel').setAttribute('aria-expanded',open);if(!open)choose('');draw();link()};
$('selectObject').onchange=e=>choose(e.target.value);$('clearSelection').onclick=()=>choose('');$('modelPlus').onclick=()=>{scale=Math.min(1.8,scale+.15);draw()};$('modelMinus').onclick=()=>{scale=Math.max(.5,scale-.15);draw()};$('modelReset').onclick=()=>{yaw=-.65;pitch=.45;scale=1;draw()};
model.onpointerdown=e=>{dragging={x:e.clientX,y:e.clientY,yaw,pitch,pick:e.target.dataset.pick,moved:false};model.setPointerCapture(e.pointerId)};
model.onpointermove=e=>{if(!dragging)return;let dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;if(Math.hypot(dx,dy)>4)dragging.moved=true;if(dragging.moved){yaw=dragging.yaw+dx*.01;pitch=Math.max(-1.4,Math.min(1.4,dragging.pitch+dy*.01));draw()}};
model.onpointerup=()=>{if(dragging&&!dragging.moved&&dragging.pick)choose(dragging.pick);dragging=null};model.onpointercancel=()=>dragging=null;model.onwheel=e=>{e.preventDefault();scale=Math.max(.5,Math.min(1.8,scale-e.deltaY*.001));draw()};draw();
})();

</script></body></html>

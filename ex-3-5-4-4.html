   const maskId=edge?.getAttribute('mask')?.match(/#([^)]*)/)?.[1];
   const animation=maskId&&document.getElementById(maskId)?.querySelector('path')?.getAnimations()[0];
   animation?.finished.then(()=>{
    if(epoch!==teachingEpoch||!group.isConnected)return;
    group.querySelectorAll(`[data-view="${config.view}"]`).forEach(n=>n.style.display='');
   }).catch(()=>{});
  }
  if(delayed)teachingTimer=setTimeout(()=>{
  if(epoch!==teachingEpoch||!group.isConnected)return;
  pending.forEach(n=>n.style.display='');
 },drawDuration+40);
}
function drawModel(){
 $('model').replaceChildren();
 const camera=[-Math.sin(az)*Math.cos(el),Math.cos(az)*Math.cos(el),Math.sin(el)];
 // Draw only outward-facing surfaces, then depth-sort to respect occlusion.
 const visible=faces.filter(f=>normals[f.id].reduce((v,n,i)=>v+n*camera[i],0)>0.00001);
 visible.sort((a,b)=>a.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/a.vertices.length-b.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/b.vertices.length);
 for(const f of visible){const ps=f.vertices.map(projectModel),g=node('g',{'data-face':f.id});
 const shape=node('path',{d:pathD(ps),fill:selected?.kind==='face'&&selected.id===f.id?'#e6a0cb':['#b7d8df','#a5c9d4','#d1e7e9'][f.id%3],stroke:'#446570','stroke-width':1.6,tabindex:0,role:'button','aria-label':f.name});
 shape.dataset.face=f.id;shape.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}};g.append(shape);
 f.vertices.forEach((a,i)=>{const b=f.vertices[(i+1)%f.vertices.length],pa=ps[i],pb=ps[(i+1)%ps.length];const hit=node('line',{x1:pa[0],y1:pa[1],x2:pb[0],y2:pb[1],stroke:'transparent','stroke-width':12,'data-edge':i,'data-face':f.id});g.append(hit)});
 $('model').append(g);
 }
 if(selected?.kind==='edge'){
  const [a,b]=selected.vertices.map(projectModel);$('model').append(node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#b72a80','stroke-width':4,'pointer-events':'none'}));
 }
 $('modelMinus').disabled=modelScale<=.6;$('modelPlus').disabled=modelScale>=1.7;
}
faces.forEach(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.name;$('faceSelect').append(o)});
$('faceSelect').onchange=e=>{if(e.target.value===''){choose(null);return}const f=faces[+e.target.value];choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})};
$('toggleModel').onclick=()=>{const hidden=!$('modelContent').hidden;$('modelContent').hidden=hidden;document.querySelector('.workspace').classList.toggle('model-open',!hidden);$('toggleModel').textContent=hidden?'显示 3D 模型':'隐藏 3D 模型';$('toggleModel').setAttribute('aria-expanded',!hidden);drawModel();updateHighlight()};
function modelZoom(delta){modelScale=Math.min(1.7,Math.max(.6,modelScale+delta));drawModel()}
$('modelMinus').onclick=()=>modelZoom(-.1);$('modelPlus').onclick=()=>modelZoom(.1);
$('modelReset').onclick=()=>{az=.35;el=.52;modelScale=1;drawModel()};$('clearSelection').onclick=()=>choose(null);
$('model').addEventListener('wheel',e=>{e.preventDefault();modelZoom(e.deltaY>0?-.08:.08)},{passive:false});
$('model').onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,az,el,target:e.target,moved:false};$('model').setPointerCapture(e.pointerId)};
$('model').onpointermove=e=>{if(!modelDrag)return;const dx=e.clientX-modelDrag.x,dy=e.clientY-modelDrag.y;if(Math.hypot(dx,dy)>4)modelDrag.moved=true;if(modelDrag.moved){az=modelDrag.az+dx*.009;el=Math.min(1.5,Math.max(-1.5,modelDrag.el+dy*.009));drawModel()}};
$('model').onpointerup=e=>{if(!modelDrag)return;const d=modelDrag;modelDrag=null;if(d.moved)return;const t=d.target;if(t.dataset.face!==undefined){const f=faces[+t.dataset.face];if(t.dataset.edge!==undefined){const i=+t.dataset.edge;choose({kind:'edge',name:f.name+'的棱线',vertices:[f.vertices[i],f.vertices[(i+1)%f.vertices.length]]})}else choose({kind:'face',id:f.id,name:f.name,vertices:f.vertices})}else choose(null)};
$('model').onpointercancel=()=>modelDrag=null;
$('exercisePicker').onchange=e=>location.href='作业3.5-4('+e.target.value+').html';
render();drawModel();

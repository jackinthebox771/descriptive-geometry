<script>



const shapeGeometry=(()=>{
 const d={halfWidth:87,depth:105,baseHeight:18,wallDepth:35,wallTop:102,
  grooveRadius:44,wedgeBack:70,wedgeFront:105,wedgeHalfBase:60,
  wedgeHalfTop:44,wedgeTop:50};
 const groove=(y,n=64)=>Array.from({length:n+1},(_,i)=>{
  const t=Math.PI*i/n;return[d.grooveRadius*Math.cos(t),y,d.wallTop-d.grooveRadius*Math.sin(t)]});
 return{d,groove};
})();
const d=shapeGeometry.d,solidFaces=[],solidEdges=[],edgeSeen=new Set(),apparentTangents=[];
const V=(x,y,z)=>[x,y,z],B=d.baseHeight,T=d.wallTop,HW=d.halfWidth,D=d.depth,
 WD=d.wallDepth,R=d.grooveRadius,YB=d.wedgeBack,YF=d.wedgeFront,
 WB=d.wedgeHalfBase,WT=d.wedgeHalfTop,HT=d.wedgeTop;
function addFace(pts,key,name){if(pts.length>=3)solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=pts[0],b=pts.at(-1),id=[a,b].map(p=>p.map(v=>v.toFixed(6)).join(',')).sort().join(';');
 if(edgeSeen.has(id))return;edgeSeen.add(id);solidEdges.push({pts,key,name})}
const E=(a,b,key,name)=>addEdge([a,b],key,name);
// The uninterrupted low base is a single cuboid.
addFace([V(HW,0,0),V(-HW,0,0),V(-HW,D,0),V(HW,D,0)],'base','底板底面');
addFace([V(HW,0,0),V(-HW,0,0),V(-HW,0,B),V(HW,0,B)],'base','底板后面');
addFace([V(HW,D,0),V(-HW,D,0),V(-HW,D,B),V(HW,D,B)],'base','底板前面');
for(const x of [-HW,HW])addFace([V(x,0,0),V(x,D,0),V(x,D,B),V(x,0,B)],'base','底板侧面');
addFace([V(HW,0,B),V(-HW,0,B),V(-HW,D,B),V(HW,D,B)],'base','底板上表面');
// Keep only physical boundaries: coplanar base/wall and base/boss joins are not edges.
for(const y of [0,D])E(V(HW,y,0),V(-HW,y,0),'base','底板底部横棱');
for(const [a,b] of [[-HW,-WB],[WB,HW]])E(V(a,D,B),V(b,D,B),'base','底板前上棱');
for(const x of [-HW,HW]){
 E(V(x,0,0),V(x,D,0),'base','底板底部纵棱');
 E(V(x,WD,B),V(x,D,B),'base','底板外露侧上棱');
 E(V(x,0,0),V(x,0,T),'wall','后侧连续外棱');
 E(V(x,D,0),V(x,D,B),'base','底板前竖棱');
}
// Rear upright: planar end faces are material below a downward semicircle.
const rearArc=shapeGeometry.groove(0),frontArc=shapeGeometry.groove(WD);
const xs=[-HW,...Array.from({length:65},(_,i)=>-R+2*R*i/64),HW];
const roof=x=>Math.abs(x)>R+1e-8?T:T-Math.sqrt(Math.max(0,R*R-x*x));
for(const y of [0,WD])for(let i=0;i<xs.length-1;i++){
 const a=xs[i],b=xs[i+1];
 addFace([V(a,y,B),V(b,y,B),V(b,y,roof(b)),V(a,y,roof(a))],'wall','立板端面');
}
for(const x of [-HW,HW])addFace([V(x,0,B),V(x,WD,B),V(x,WD,T),V(x,0,T)],'wall','立板侧面');
for(const [a,b] of [[-HW,-R],[R,HW]])addFace([V(a,0,T),V(b,0,T),V(b,WD,T),V(a,WD,T)],'wall','立板顶肩');
for(let i=0;i<rearArc.length-1;i++)addFace([rearArc[i],rearArc[i+1],frontArc[i+1],frontArc[i]],'groove','半圆柱槽面');
for(const y of [0,WD]){
 if(y===WD)for(const x of [-HW,HW])E(V(x,y,B),V(x,y,T),'wall','立板前侧竖棱');
 for(const [a,b] of [[-HW,-R],[R,HW]])E(V(a,y,T),V(b,y,T),'wall','立板顶肩边');
 addEdge(y===0?rearArc:frontArc,'groove','槽口半圆端缘');
 if(y===WD)E(V(HW,y,B),V(-HW,y,B),'wall','立板前足交界');
}
for(const x of [-HW,-R,R,HW])E(V(x,0,T),V(x,WD,T),'wall','立板顶部纵棱');
// Front trapezoidal prism; its lower face coincides with the base top.
for(const y of [YB,YF]){
 addFace([V(WB,y,B),V(-WB,y,B),V(-WT,y,HT),V(WT,y,HT)],'wedge','梯形凸台端面');
 if(y===YB)E(V(WB,y,B),V(-WB,y,B),'wedge','凸台后下棱');
 E(V(WT,y,HT),V(-WT,y,HT),'wedge','凸台上棱');
 for(const sign of [-1,1])E(V(sign*WB,y,B),V(sign*WT,y,HT),'wedge','凸台斜棱');
}
addFace([V(WT,YB,HT),V(-WT,YB,HT),V(-WT,YF,HT),V(WT,YF,HT)],'wedge','凸台顶面');
for(const sign of [-1,1])addFace([V(sign*WB,YB,B),V(sign*WB,YF,B),V(sign*WT,YF,HT),V(sign*WT,YB,HT)],'wedge','凸台斜侧面');
for(const x of [-WB,WB])E(V(x,YB,B),V(x,YF,B),'wedge','凸台足部纵棱');
for(const x of [-WT,WT])E(V(x,YB,HT),V(x,YF,HT),'wedge','凸台顶部纵棱');

function makeLesson(){
 const k=1.10,a=Math.SQRT1_2/2,origin=[780,525];
 const F=(x,z)=>[205-1.2*x,320-1.2*z],Q=(y,z)=>[390+1.2*y,320-1.2*z];
 const I=(x,y,z)=>[origin[0]+k*(-x+a*y),origin[1]+k*(a*y-z)];
 const line=(p,q,order=0,extra={})=>({type:'line',a:p,b:q,order,...extra});
 const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
 const L=(p,q,order)=>line(I(...p),I(...q),order);
 const arc=(y,project,order=0)=>({type:'path',points:shapeGeometry.groove(y).map(project),order});
 const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
 const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
 let seq=0;const measuredDepths=new Set();
 const measure=(out,p,q,view,aux=false)=>{const order=seq++*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>Q(r[1],r[2]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter};
  const depth=view==='side'&&Math.abs(q[1]-p[1])>1e-8;
  if(depth){const length=Math.abs(q[1]-p[1]).toFixed(6);out.push(line(s,t,order,tmp));
   if(!measuredDepths.has(length)){measuredDepths.add(length);const side=s[0]<450?-1:1,unit=[side*34,11],p1=[s[0]+unit[0],s[1]+unit[1]],p2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[p1[0]+t[0]-p2[0],p1[1]+t[1]-p2[1]],mid=intersect(s,t,p1,parallel),ul=Math.hypot(...unit),norm=[-unit[1]/ul*3.5,unit[0]/ul*3.5],tick=(p,o)=>line([p[0]-norm[0],p[1]-norm[1]],[p[0]+norm[0],p[1]+norm[1]],o,tmp);
    out.push(line(s,p1,order+1,tmp),tick(p1,order+2),{type:'point',xy:p1,order:order+2,...tmp},line(p1,p2,order+3,tmp),tick(p2,order+4),{type:'point',xy:p2,order:order+4,...tmp});
    out.push(line(p2,t,order+5,tmp),line(p1,mid,order+6,tmp),{type:'point',xy:mid,order:order+7,...tmp},line(s,mid,order+8,tmp),brace(s,mid,8,order+8,removeAfter));
   }else{const mid=[(s[0]+t[0])/2,(s[1]+t[1])/2];out.push({type:'point',xy:mid,order:order+1,...tmp},line(s,mid,order+2,tmp),brace(s,mid,8,order+2,removeAfter))}
   out.push(line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
  }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
  out.push({...L(p,q,order+13),...(aux?tmp:{})});
 };
 const join=(out,p,q)=>out.push(L(p,q,seq++*14));
 const guide=(out,p,q)=>{const order=seq++*14;out.push({...L(p,q,order),temporary:true,removeAfter:order+13})};
 const givenFront=[],givenSide=[],givenHidden=[],center=[];
 const fl=(x,z,X,Z,hidden=false)=>(hidden?givenHidden:givenFront).push(line(F(x,z),F(X,Z)));
 const sl=(y,z,Y,Z,hidden=false)=>(hidden?givenHidden:givenSide).push(line(Q(y,z),Q(Y,Z)));
 // Front view: base, rear wall and the symmetric trapezoidal foreground boss.
 fl(HW,0,-HW,0);fl(HW,0,HW,T);fl(-HW,0,-HW,T);
 fl(HW,T,R,T);fl(-R,T,-HW,T);givenFront.push(arc(0,p=>F(p[0],p[2])));
 fl(HW,B,WB,B);fl(-WB,B,-HW,B);fl(WB,B,WT,HT);fl(WT,HT,-WT,HT);fl(-WT,HT,-WB,B);
 fl(WB,B,-WB,B,true);
 // Side view: wall at the rear, one exposed middle bay and a front boss.
 sl(0,0,D,0);sl(0,0,0,T);sl(0,T,WD,T);sl(WD,T,WD,B);sl(WD,B,YB,B);
 sl(YB,B,YB,HT);sl(YB,HT,YF,HT);sl(YF,HT,YF,0);sl(0,T-R,WD,T-R,true);
 center.push(line(F(0,-7),F(0,T+10)),line(Q(-7,T-R),Q(WD+7,T-R)));
 const base=[],baseFrontJoin=[],plate=[],wedge=[];
 const O=V(0,0,0),rearLeft=V(HW,0,0),rearRight=V(-HW,0,0),frontLeft=V(HW,D,0),frontRight=V(-HW,D,0);
 measure(base,O,rearLeft,'front');measure(base,O,rearRight,'front');
 measure(base,rearRight,frontRight,'side');join(base,rearLeft,frontLeft);join(base,frontLeft,frontRight);
 for(const x of [HW,-HW])for(const y of [0,D])measure(base,V(x,y,0),V(x,y,B),'front');
 join(base,V(HW,0,B),V(-HW,0,B));join(base,V(-HW,0,B),V(-HW,D,B));
 join(base,V(-HW,D,B),V(-WB,D,B));
 join(baseFrontJoin,V(-WB,D,B),V(WB,D,B));
 join(base,V(WB,D,B),V(HW,D,B));join(base,V(HW,D,B),V(HW,0,B));
 // Complete the rear plate face, including its true semicircle, before transferring depth.
 seq=0;for(const x of [HW,-HW])measure(plate,V(x,0,B),V(x,0,T),'front');
 plate.push({type:'point',xy:I(0,0,T),order:seq++*14});
 measure(plate,V(HW,0,T),V(R,0,T),'front');
 measure(plate,V(-HW,0,T),V(-R,0,T),'front');
 plate.push(arc(0,p=>I(...p),seq++*14));
 // Locate the front arc center from the rear center before drawing its face.
 measure(plate,V(0,0,T),V(0,WD,T),'side',true);
 plate.push({type:'point',xy:I(0,WD,T),order:seq++*14});
 // The outer depth edges reuse the same measured half-depth.
 measure(plate,V(-HW,0,T),V(-HW,WD,T),'side');
 join(plate,V(HW,0,T),V(HW,WD,T));

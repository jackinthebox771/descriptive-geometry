<script>


const shapeGeometry=(()=>{
 const d={width:169,wallStart:36,braceStart:129,firstDepth:42,baseDepth:84,totalDepth:126,baseHeight:24,wallHeight:48,braceHeight:71};
 const braceTop=y=>y<=d.firstDepth?d.braceHeight:d.braceHeight-(d.braceHeight-d.baseHeight)*(y-d.firstDepth)/(d.totalDepth-d.firstDepth);
 return{d,braceTop};
})();
const d=shapeGeometry.d,solidFaces=[],solidEdges=[],edgeSeen=new Set();
const V=(x,y,z)=>[x,y,z],F0=d.firstDepth,D=d.baseDepth,T=d.totalDepth,H=d.baseHeight,W=d.width,M=d.wallStart,R=d.braceStart,Z=d.wallHeight,Q=d.braceHeight;
function addFace(pts,key,name){solidFaces.push({pts,key,name})}
function E(a,b,key,name){const id=[a,b].map(p=>p.map(v=>v.toFixed(6)).join(',')).sort().join(';');if(edgeSeen.has(id))return;edgeSeen.add(id);solidEdges.push({pts:[a,b],key,name})}
// Exposed union surface of the lower step, upper step and cut side wall.
addFace([V(0,0,0),V(R,0,0),V(R,D,0),V(0,D,0)],'base','下台阶底面');
addFace([V(R,0,0),V(W,0,0),V(W,T,0),V(R,T,0)],'rib','边墙底面');
addFace([V(0,0,H),V(M,0,H),V(M,D,H),V(0,D,H)],'base','底板上表面');
addFace([V(M,F0,H),V(R,F0,H),V(R,D,H),V(M,D,H)],'base','底板上表面');
addFace([V(0,0,0),V(M,0,0),V(M,0,H),V(0,0,H)],'base','底板后表面');
addFace([V(M,0,0),V(R,0,0),V(R,0,Z),V(M,0,Z)],'wall','墙身后表面');
addFace([V(R,0,0),V(W,0,0),V(W,0,Q),V(R,0,Q)],'rib','斜撑后表面');
addFace([V(0,0,0),V(0,D,0),V(0,D,H),V(0,0,H)],'base','底板左表面');
addFace([V(0,D,0),V(R,D,0),V(R,D,H),V(0,D,H)],'base','底板前表面');
addFace([V(W,0,0),V(W,F0,0),V(W,F0,Q),V(W,0,Q)],'rib','斜撑右表面');
addFace([V(W,F0,0),V(W,T,0),V(W,T,H),V(W,F0,Q)],'rib','斜撑右表面');
addFace([V(R,T,0),V(W,T,0),V(W,T,H),V(R,T,H)],'rib','斜撑前表面');
addFace([V(R,D,0),V(R,T,0),V(R,T,H),V(R,D,shapeGeometry.braceTop(D))],'rib','斜撑左表面');
addFace([V(R,F0,H),V(R,D,H),V(R,D,shapeGeometry.braceTop(D)),V(R,F0,Q)],'rib','斜撑左表面');
addFace([V(R,0,Z),V(R,F0,Z),V(R,F0,Q),V(R,0,Q)],'rib','斜撑左表面');
addFace([V(M,0,H),V(M,F0,H),V(M,F0,Z),V(M,0,Z)],'wall','墙身左表面');
addFace([V(M,F0,H),V(R,F0,H),V(R,F0,Z),V(M,F0,Z)],'wall','墙身前表面');
addFace([V(M,0,Z),V(R,0,Z),V(R,F0,Z),V(M,F0,Z)],'wall','墙身顶面');
addFace([V(R,0,Q),V(W,0,Q),V(W,F0,Q),V(R,F0,Q)],'rib','斜撑平顶');
addFace([V(R,F0,Q),V(W,F0,Q),V(W,T,H),V(R,T,H)],'rib','斜撑斜面');
// Physical creases only: no lines on coplanar panel joins.
for(const [a,b] of [[V(0,0,0),V(W,0,0)],[V(W,0,0),V(W,T,0)],[V(W,T,0),V(R,T,0)],[V(R,T,0),V(R,D,0)],[V(R,D,0),V(0,D,0)],[V(0,D,0),V(0,0,0)]])E(a,b,'base','底板底棱');
for(const [x,y,h] of [[0,0,H],[0,D,H],[R,D,H],[R,T,H],[W,T,H],[W,0,Q]])E(V(x,y,0),V(x,y,h),'base','外轮廓竖棱');
for(const [a,b] of [[V(0,0,H),V(M,0,H)],[V(0,0,H),V(0,D,H)],[V(0,D,H),V(R,D,H)],[V(M,0,H),V(M,F0,H)],[V(M,F0,H),V(R,F0,H)],[V(R,F0,H),V(R,D,H)]])E(a,b,'base','底板上棱');
for(const [a,b] of [[V(M,0,H),V(M,0,Z)],[V(M,F0,H),V(M,F0,Z)],[V(R,F0,H),V(R,F0,Z)],[V(M,0,Z),V(R,0,Z)],[V(M,0,Z),V(M,F0,Z)],[V(M,F0,Z),V(R,F0,Z)],[V(R,0,Z),V(R,F0,Z)]])E(a,b,'wall','墙身棱线');
for(const [a,b] of [[V(R,0,Z),V(R,0,Q)],[V(R,0,Q),V(W,0,Q)],[V(R,0,Q),V(R,F0,Q)],[V(W,0,Q),V(W,F0,Q)],[V(R,F0,Q),V(W,F0,Q)],[V(R,F0,Q),V(R,T,H)],[V(W,F0,Q),V(W,T,H)],[V(R,T,H),V(W,T,H)]])E(a,b,'rib','斜撑边界');
function makeLesson(){
 const k=1.25,a=Math.SQRT1_2/2,origin=[550+1.25*W,360+1.25*H];
 const F=(x,z)=>[145+k*x,175-k*z],P=(x,y)=>[145+k*x,250+k*y],S=(y,z)=>[390+k*y,175-k*z];
 const I=(x,y,z)=>[origin[0]+k*(x-W+a*y),origin[1]+k*(a*y-z)];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra});
  const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
  const point=(p,order)=>({type:'point',xy:I(...p),order});
  const poly=(pts,order=0,closed=false)=>({type:'path',points:pts,order,closed});
  const L=(a,b,order)=>line(I(...a),I(...b),order);
  const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
  const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
  const measured=(p,q,seq,view,aux=false)=>{
    const order=seq*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>P(r[0],r[1]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter},out=[];
    const mark=(xy,o)=>({type:'point',xy,order:o,...tmp});
    const isDepth=view==='top'&&Math.abs(q[0]-p[0])<1e-8&&Math.abs(q[1]-p[1])>1e-8;
    if(isDepth){
      out.push(line(s,t,order,tmp));let m,halfOrder;
      const direct=false;
      if(direct){m=P(0,shapeGeometry.d.depth/2);out.push(mark(m,order+1));halfOrder=order+2}
      else{
        const side=s[0]<190?-1:1,unit=[side*36,12],u1=[s[0]+unit[0],s[1]+unit[1]],u2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[u1[0]+t[0]-u2[0],u1[1]+t[1]-u2[1]];
        m=intersect(s,t,u1,parallel);
        const len=Math.hypot(...unit),normal=[-unit[1]/len*3.5,unit[0]/len*3.5],tick=(p,o)=>line([p[0]-normal[0],p[1]-normal[1]],[p[0]+normal[0],p[1]+normal[1]],o,tmp);
        out.push(line(s,u1,order+1,tmp),tick(u1,order+2),mark(u1,order+2),line(u1,u2,order+3,tmp),tick(u2,order+4),mark(u2,order+4));
        out.push(line(u2,t,order+5,tmp),line(u1,m,order+6,tmp),mark(m,order+7));halfOrder=order+8;
      }
      out.push(line(s,m,halfOrder,tmp),brace(s,m,8,halfOrder,removeAfter),line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
    }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
    out.push({...L(p,q,order+13),...(aux?tmp:{})});return out;
  };

 const givenFront=[],givenPlan=[],givenSide=[];
 const fl=(x0,z0,x1,z1)=>givenFront.push(line(F(x0,z0),F(x1,z1)));
 const pl=(x0,y0,x1,y1)=>givenPlan.push(line(P(x0,y0),P(x1,y1)));
 const sl=(y0,z0,y1,z1)=>givenSide.push(line(S(y0,z0),S(y1,z1)));
 // The displayed given views are line unions projected from the same dimensions.
 fl(0,0,W,0);fl(0,0,0,H);fl(0,H,W,H);fl(M,H,M,Z);fl(M,Z,R,Z);fl(R,0,R,Q);fl(R,Q,W,Q);fl(W,0,W,Q);
 for(const [x0,y0,x1,y1] of [[0,0,W,0],[W,0,W,T],[W,T,R,T],[R,T,R,D],[R,D,0,D],[0,D,0,0],[M,0,M,F0],[M,F0,W,F0],[R,0,R,T]])pl(x0,y0,x1,y1);
 for(const [y0,z0,y1,z1] of [[0,0,T,0],[0,0,0,Q],[0,Q,F0,Q],[F0,Q,T,H],[T,H,T,0],[0,H,T,H],[0,Z,F0,Z],[F0,H,F0,Z],[D,0,D,H]])sl(y0,z0,y1,z1);
 let seq=0;const base=[],wall=[],rib=[],measuredDepths=new Set();
 const measure=(out,p,q,view,aux=false,forceHalf=false)=>{
  const depth=view==='top'&&Math.abs(p[0]-q[0])<1e-8&&Math.abs(p[1]-q[1])>1e-8;
  if(depth){
   const length=Math.abs(p[1]-q[1]).toFixed(6);
   if(measuredDepths.has(length)&&!forceHalf){
    const order=seq++*14,removeAfter=order+13,tmp={temporary:true,removeAfter};
    const s=P(p[0],p[1]),t=P(q[0],q[1]),mid=[(s[0]+t[0])/2,(s[1]+t[1])/2],u=I(...p),v=I(...q);
    out.push(line(s,t,order,tmp),{type:'point',xy:mid,order:order+1,...tmp},line(s,mid,order+2,tmp),brace(s,mid,8,order+2,removeAfter));
    out.push(line(u,v,order+4,tmp),brace(u,v,-8,order+4,removeAfter));
    const e=L(p,q,order+13);out.push(aux?{...e,...tmp}:e);return;
   }
   measuredDepths.add(length);
  }
  out.push(...measured(p,q,seq++,view,aux));
 };
 const join=(out,p,q)=>out.push(L(p,q,seq++*14));
 // Step 03: draw the side wall bottom on z=0, raise its four corners, then
 // complete only axis-parallel top edges before joining the two sloping edges.
 const rb=[V(W,0,0),V(R,0,0),V(R,T,0),V(W,T,0)];
 const rt=[V(W,0,Q),V(R,0,Q),V(R,T,H),V(W,T,H)];
 const rf=[V(W,F0,Q),V(R,F0,Q)];
 measure(rib,rb[0],rb[1],'front');measure(rib,rb[1],rb[2],'top');
 join(rib,rb[2],rb[3]);join(rib,rb[3],rb[0]);
 for(let i=0;i<4;i++)measure(rib,rb[i],rt[i],'front');
 join(rib,rt[0],rt[1]);
 measure(rib,rt[0],rf[0],'top');join(rib,rt[1],rf[1]);

<script>


const shapeGeometry=(()=>{
 const d={width:102,depth:81,height:145,baseHeight:23,wallX:79,wallEnd:81,ribStart:29,ribEnd:52,crestX:50};
 const roof=(i,j,x)=>i===2?d.height:j===1&&i<2?d.baseHeight+(d.height-d.baseHeight)*Math.min(x/d.crestX,1):d.baseHeight;

})();
const solidFaces=[],solidEdges=[],edgeSeen=new Set();

 const x0=xs[i],x1=xs[i+1],y0=ys[j],y1=ys[j+1],z0=h(i,j,x0),z1=h(i,j,x1),key=i===2?'wall':j===1&&i<2?'rib':'base';

 if(i===0)addFace([[x0,y0,0],[x0,y1,0],[x0,y1,d.baseHeight],[x0,y0,d.baseHeight]],'base','底板左侧面');
 if(i===2)addFace([[x1,y0,0],[x1,y1,0],[x1,y1,d.baseHeight],[x1,y0,d.baseHeight]],'base','底板右侧面');
 if(j===0)addFace([[x0,y0,0],[x1,y0,0],[x1,y0,d.baseHeight],[x0,y0,d.baseHeight]],'base','底板前侧面');
 if(j===2)addFace([[x0,y1,0],[x1,y1,0],[x1,y1,d.baseHeight],[x0,y1,d.baseHeight]],'base','底板后侧面');
 // Only exposed height differences create upper vertical faces.
 for(const [axis,side,ni,nj] of [['x',0,i-1,j],['x',1,i+1,j],['y',0,i,j-1],['y',1,i,j+1]]){
   let a,b;if(axis==='x'){const x=side?x1:x0;a=[x,y0];b=[x,y1]}else{const y=side?y1:y0;a=[x0,y];b=[x1,y]}
   const ha=h(i,j,a[0]),hb=h(i,j,b[0]),la=h(ni,nj,a[0]),lb=h(ni,nj,b[0]);
   if(ha<la-1e-8||hb<lb-1e-8||Math.abs(ha-la)+Math.abs(hb-lb)<1e-8)continue;
   addFace([[...a,la],[...b,lb],[...b,hb],[...a,ha]],key,key==='wall'?'墙身表面':'斜撑截面');
 }
}
// Coplanar seams of the component union are not physical edges.
const edgeMap=new Map();
for(const f of solidFaces){let n;for(let j=1;j<f.pts.length-1;j++){const a=f.pts[0],b=f.pts[j],c=f.pts[j+1],u=b.map((v,k)=>v-a[k]),v=c.map((v,k)=>v-a[k]),cross=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...cross);if(len>1e-8){n=cross.map(v=>v/len);break}}if(!n)continue;const first=n.find(v=>Math.abs(v)>1e-8);if(first<0)n=n.map(v=>-v);const normal=n.map(v=>v.toFixed(5)).join(',');
 for(let j=0;j<f.pts.length;j++){const a=f.pts[j],b=f.pts[(j+1)%f.pts.length],ka=pointCode(a),kb=pointCode(b),id=ka<kb?ka+';'+kb:kb+';'+ka;if(!edgeMap.has(id))edgeMap.set(id,{pts:[a,b],normals:new Set(),key:f.key});const e=edgeMap.get(id);e.normals.add(normal);if(f.key!=='base')e.key=f.key}
}
for(const e of edgeMap.values())if(e.normals.size>1)solidEdges.push({pts:e.pts,key:e.key,name:e.key==='base'?'底板棱线':e.key==='wall'?'墙身边界':'斜撑边界'});

function makeLesson(){
 const k=1.3,a=Math.SQRT1_2/2,origin=[660,450];
 const F=(x,z)=>[150+k*x,270-k*z],P=(x,y)=>[150+k*x,355+k*y];
 // Local coordinates: X=width-x (positive left), Y=y, Z=z-baseHeight.
 const I=(x,y,z)=>[origin[0]+k*(x-d.width+a*y),origin[1]+k*(a*y-(z-d.baseHeight))];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra});
  const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
  const point=(p,order)=>({type:'point',xy:I(...p),order});
  const poly=(pts,order=0,closed=false)=>({type:'path',points:pts,order,closed});

  const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
  const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
  const measured=(p,q,seq,view,aux=false)=>{
    const order=seq*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>P(r[0],r[1]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter},out=[];
    const mark=(xy,o)=>({type:'point',xy,order:o,...tmp});

      const direct=false;

        const side=s[0]<190?-1:1,unit=[side*36,12],u1=[s[0]+unit[0],s[1]+unit[1]],u2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[u1[0]+t[0]-u2[0],u1[1]+t[1]-u2[1]];

        const len=Math.hypot(...unit),normal=[-unit[1]/len*3.5,unit[0]/len*3.5],tick=(p,o)=>line([p[0]-normal[0],p[1]-normal[1]],[p[0]+normal[0],p[1]+normal[1]],o,tmp);
        out.push(line(s,u1,order+1,tmp),tick(u1,order+2),mark(u1,order+2),line(u1,u2,order+3,tmp),tick(u2,order+4),mark(u2,order+4));
        out.push(line(u2,t,order+5,tmp),line(u1,m,order+6,tmp),mark(m,order+7));halfOrder=order+8;
      }
      out.push(line(s,m,halfOrder,tmp),brace(s,m,8,halfOrder,removeAfter),line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
    }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
    out.push({...L(p,q,order+13),...(aux?tmp:{})});return out;
  };

  const projectEdges=project=>{const groups=new Map();for(const e of solidEdges){const p=project(e.pts[0]),q=project(e.pts[1]),dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);if(len<1e-8)continue;let ux=dx/len,uy=dy/len;if(ux<-1e-8||Math.abs(ux)<1e-8&&uy<0){ux=-ux;uy=-uy}const c=-uy*p[0]+ux*p[1],key=[ux,uy,c].map(v=>v.toFixed(6)).join(','),t0=ux*p[0]+uy*p[1],t1=ux*q[0]+uy*q[1];if(!groups.has(key))groups.set(key,{ux,uy,c,spans:[]});groups.get(key).spans.push([Math.min(t0,t1),Math.max(t0,t1)])}const out=[];for(const {ux,uy,c,spans} of groups.values()){spans.sort((a,b)=>a[0]-b[0]);const merged=[];for(const s of spans){const prev=merged.at(-1);if(prev&&s[0]<=prev[1]+1e-6)prev[1]=Math.max(prev[1],s[1]);else merged.push([...s])}for(const [a,b] of merged)out.push(line([ux*a-uy*c,uy*a+ux*c],[ux*b-uy*c,uy*b+ux*c]))}return out};

 // Given projections use the same exposed physical edges and independent view depths.
 const projectedVisible=(project)=>{const faces=solidFaces.map(f=>{const q=f.pts.map(project);return{q,plane:screenPlane(q)}});return solidEdges.filter(e=>{const p=e.pts[0].map((v,i)=>(v+e.pts[1][i])/2),q=project(p);return !faces.some(f=>{const z=faceDepth(f,q[0],q[1]);return z!==null&&z>q[2]+1e-7})})};

 let seq=0;const base=[],wall=[],rib=[],measuredDepths=new Set();
 const measure=(out,p,q,view,aux=false)=>{
   const depth=view==='top'&&Math.abs(q[0]-p[0])<1e-8&&Math.abs(q[1]-p[1])>1e-8;
   if(depth){
     const length=Math.abs(q[1]-p[1]).toFixed(6);
     if(measuredDepths.has(length)){
       const segment=L(p,q,seq++*14);

       return;
     }
     measuredDepths.add(length);
   }
   out.push(...measured(p,q,seq++,view,aux));
 };
 const join=(out,p,q)=>out.push(L(p,q,seq++*14));
 const H=d.baseHeight,W=d.width,D=d.depth;
 const top=[[W,0,H],[0,0,H],[0,D,H],[W,D,H]],bottom=top.map(p=>[p[0],p[1],0]);
 measure(base,top[0],top[1],'top');measure(base,top[0],top[3],'top');measure(base,top[1],top[2],'top');join(base,top[3],top[2]);
 for(let i=0;i<4;i++)measure(base,top[i],bottom[i],'front');
 for(let i=0;i<4;i++)join(base,bottom[i],bottom[(i+1)%4]);
 seq=0;const b0=[W,0,H],b1=[W,D,H],b2=[W,D,d.height],b3=[W,0,d.height],front=[b0,b1,b2,b3],back=front.map(p=>[d.wallX,p[1],p[2]]);

 for(let i=0;i<4;i++)measure(wall,front[i],back[i],'front');
 for(let i=0;i<4;i++)join(wall,back[i],back[(i+1)%4]);
 seq=0;const r0=[0,d.ribStart,H],r1=[d.wallX,d.ribStart,H],r2=[d.wallX,d.ribStart,d.height],r3=[d.crestX,d.ribStart,d.height],section=[r0,r1,r2,r3],other=section.map(p=>[p[0],d.ribEnd,p[2]]);
 measure(rib,top[0],[W,d.ribStart,H],'top',true);measure(rib,[W,d.ribStart,H],r1,'top',true);measure(rib,r1,r0,'front');measure(rib,r1,r2,'front');measure(rib,r1,[d.crestX,d.ribStart,H],'top',true);measure(rib,[d.crestX,d.ribStart,H],r3,'front',true);join(rib,r2,r3);join(rib,r3,r0);

  const duration=320,gap=80,defs=node('defs');$('scene').prepend(defs);
  const allFresh=fresh.flatMap(g=>[...g.children]),orders=[...new Set(allFresh.map(n=>Number(n.dataset.order??999)).filter(n=>n!==999))];
  strokes.forEach((n,i)=>{const delay=orders.indexOf(Number(n.dataset.order??999))*(duration+gap),len=n.getTotalLength();if(!len)return;const id='draw-'+current+'-'+i,mask=node('mask',{id,maskUnits:'userSpaceOnUse',x:-100,y:-100,width:1100,height:850}),path=n.cloneNode();path.removeAttribute('class');path.style.cssText=`vector-effect:none;fill:none;stroke:#fff;stroke-width:14;stroke-dasharray:${len};stroke-dashoffset:${len}`;mask.append(path);defs.append(mask);n.setAttribute('mask',`url(#${id})`);path.animate([{strokeDashoffset:String(len)},{strokeDashoffset:'0'}],{duration,delay,fill:'both',easing:'linear'}).finished.then(()=>n.removeAttribute('mask')).catch(()=>{});drawDuration=Math.max(drawDuration,delay+duration)});
  allFresh.filter(n=>n.tagName==='text'||n.tagName==='circle').forEach(n=>{const order=Number(n.dataset.order??999),delay=order===999?drawDuration:Math.max(0,orders.indexOf(order))*(duration+gap);n.animate([{opacity:0},{opacity:1}],{duration:120,delay,fill:'backwards'});drawDuration=Math.max(drawDuration,delay+120)});
}
function retainProcessUntilAnswerFinishes(enabled){
  if(current!==7||!enabled||!drawDuration||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const geo=$('scene').querySelector('[data-pass="geometry"]'),lab=$('scene').querySelector('[data-pass="labels"]');
  for(const layer of lesson.layers.filter(l=>l.endStep===6)){
    const gg=node('g',{class:layer.role+' transient-process'}),gt=node('g',{class:layer.role+' transient-process'});
    for(const e of layer.elements)(e.type==='text'?gt:gg).append(element(e));
    if(gg.children.length)geo.prepend(gg);if(gt.children.length)lab.prepend(gt);
  }
  cleanupTimer=setTimeout(()=>{document.querySelectorAll('.transient-process').forEach(n=>n.remove());cleanupTimer=null},drawDuration+140);
}
function stop(){clearTimeout(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false')}
function go(i,animate=true){stop();current=Math.max(0,Math.min(last,i));render(animate)}
function play(){if(timer){stop();return}if(current===last){current=0;render(false)}$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');const advance=()=>{timer=setTimeout(()=>{current++;render(true);if(current>=last){timer=setTimeout(stop,Math.max(400,drawDuration+180))}else advance()},Math.max(Number($('speed').value),drawDuration+900))};advance()}

document.title=lesson.title+' 正等测图';$('title').textContent='【'+lesson.title+'】'+lesson.problem;$('progress').max=last;
lesson.steps.forEach((s,i)=>{const b=document.createElement('button');b.className='step-button';b.textContent=`${i===0?'准备':String(i).padStart(2,'0')} ${s.short}`;b.onclick=()=>go(i);$('steps').append(b)});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('complete').onclick=()=>go(last,false);$('restart').onclick=()=>{zoom=1;offset={x:0,y:0};go(0,false)};$('play').onclick=play;$('speed').onchange=()=>{if(timer){stop();play()}};$('progress').oninput=e=>go(+e.target.value);
$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);view()};$('zoomOut').onclick=()=>{zoom=Math.max(1,zoom-.25);if(zoom===1)offset={x:0,y:0};view()};$('fit').onclick=()=>{zoom=1;offset={x:0,y:0};view()};
$('canvas').onpointerdown=e=>{if(zoom===1)return;drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};$('canvas').setPointerCapture(e.pointerId)};
$('canvas').onpointermove=e=>{if(!drag)return;const r=$('diagram').getBoundingClientRect(),scale=Math.min(r.width/(lesson.size[0]/zoom),r.height/(lesson.size[1]/zoom));offset={x:drag.ox+(e.clientX-drag.x)/scale,y:drag.oy+(e.clientY-drag.y)/scale};view()};
$('canvas').onpointerup=$('canvas').onpointercancel=()=>drag=null;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch{$('status').textContent='当前浏览器不支持网页全屏，可以使用浏览器的全屏功能。'}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}if(e.code==='Space'){e.preventDefault();play()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});

const modelSvg=$('model3d'),modelStage=$('modelStage');
const modelVertices={O:[0,0,0],B:[141,55,0],C:[22,97,0],S:[48,43,141]};
const modelFaces=[['O','B','C'],['O','B','S'],['B','C','S'],['C','O','S']];
const modelEdges=[['O','B'],['B','C'],['C','O'],['O','S'],['B','S'],['C','S']];
const modelCenter=[52.75,48.75,35.25],faceColors=['#dcebea','#b8d9d6','#91c8c3','#c8e2df'];
let modelYaw=-.68,modelPitch=.56,modelScale=1,modelDrag=null;
function rotateModel(p){
  const x=p[0]-modelCenter[0],y=p[1]-modelCenter[1],z=p[2]-modelCenter[2],cy=Math.cos(modelYaw),sy=Math.sin(modelYaw),cp=Math.cos(modelPitch),sp=Math.sin(modelPitch);
  const rx=x*cy-y*sy,ry=x*sy+y*cy;
  return [rx,z*cp-ry*sp,ry*cp+z*sp];
}
function projectModel(p){const q=rotateModel(p),k=1.08*modelScale;return [150+q[0]*k,114-q[1]*k,q[2]]}
function drawModel(){
  modelSvg.replaceChildren();const q={};for(const[id,p]of Object.entries(modelVertices))q[id]=projectModel(p);
  modelFaces.map((ids,index)=>({ids,index,depth:ids.reduce((s,id)=>s+q[id][2],0)/3})).sort((a,b)=>a.depth-b.depth).forEach(face=>{
    const pts=face.ids.map(id=>q[id]),a=pts[0],b=pts[1],c=pts[2],nz=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    const opacity=nz<0?.58:.78,poly=node('polygon',{points:pts.map(p=>`${p[0]},${p[1]}`).join(' '),fill:faceColors[face.index],opacity,stroke:'#54727a','stroke-width':1.1,'stroke-linejoin':'round'});modelSvg.append(poly);
  });
  for(const[a,b]of modelEdges){const p=q[a],r=q[b];modelSvg.append(node('line',{x1:p[0],y1:p[1],x2:r[0],y2:r[1],class:'model-edge'}))}
  for(const[id,p]of Object.entries(q)){modelSvg.append(node('circle',{cx:p[0],cy:p[1],r:3.6,class:'model-point'}));modelSvg.append(node('text',{x:p[0]+(p[0]<150?-16:7),y:p[1]-7,class:'model-label'},id))}
}
modelStage.onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,yaw:modelYaw,pitch:modelPitch};modelStage.setPointerCapture(e.pointerId);e.preventDefault()};
modelStage.onpointermove=e=>{if(!modelDrag)return;modelYaw=modelDrag.yaw+(e.clientX-modelDrag.x)*.012;modelPitch=modelDrag.pitch+(e.clientY-modelDrag.y)*.012;drawModel()};
modelStage.onpointerup=modelStage.onpointercancel=()=>modelDrag=null;
modelStage.addEventListener('wheel',e=>{e.preventDefault();modelScale=Math.max(.62,Math.min(1.55,modelScale-e.deltaY*.001));drawModel()},{passive:false});
modelStage.onkeydown=e=>{const d=.14;if(e.key==='ArrowLeft')modelYaw-=d;else if(e.key==='ArrowRight')modelYaw+=d;else if(e.key==='ArrowUp')modelPitch-=d;else if(e.key==='ArrowDown')modelPitch+=d;else return;e.preventDefault();drawModel()};
$('modelReset').onclick=()=>{modelYaw=-.68;modelPitch=.56;modelScale=1;drawModel();modelStage.focus()};
drawModel();render(false);
</script>

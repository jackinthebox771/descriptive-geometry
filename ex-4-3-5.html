<script>


const shapeGeometry=(()=>{
 const d={baseHalf:102.5,baseDepth:102,baseHeight:26,tongueHalf:80.5,tongueDepth:41,tongueHeight:13,bodyHalf:80.5,bodyDepth:52,wallTop:134,roofApex:170,holeCenterZ:83,holeRadius:43.2,holeShoulderZ:50};
 d.holeShoulderHalf=Math.sqrt(d.holeRadius**2-(d.holeShoulderZ-d.holeCenterZ)**2);
 d.holeCrown=d.holeCenterZ+d.holeRadius;
 const left=Math.atan2(d.holeShoulderZ-d.holeCenterZ,-d.holeShoulderHalf)+2*Math.PI;
 const right=Math.atan2(d.holeShoulderZ-d.holeCenterZ,d.holeShoulderHalf);
 const arc=(y,n=56)=>Array.from({length:n+1},(_,i)=>{const t=left+(right-left)*i/n;return[d.holeRadius*Math.cos(t),y,d.holeCenterZ+d.holeRadius*Math.sin(t)]});
 const crownHalf=z=>z<=d.holeShoulderZ?d.holeShoulderHalf:Math.sqrt(Math.max(0,d.holeRadius**2-(z-d.holeCenterZ)**2));
 return{d,arc,crownHalf};
})();
const d=shapeGeometry.d,solidFaces=[],solidEdges=[],edgeSeen=new Set();
const A=(x,y,z)=>[x,y,z],P=(x,y,z)=>[x,y,z],BF=d.baseHalf,TF=d.tongueHalf,BH=d.baseHeight,BW=d.bodyHalf,BD=d.bodyDepth,FD=d.baseDepth,TD=d.baseDepth+d.tongueDepth,SH=d.holeShoulderHalf,SC=d.holeShoulderZ,WT=d.wallTop;
function addFace(pts,key,name){if(pts.length<3)return;solidFaces.push({pts,key,name})}
function addEdge(pts,key,name){const a=pts[0],b=pts.at(-1),id=[a,b].map(p=>p.map(v=>v.toFixed(5)).join(',')).sort().join(';');if(edgeSeen.has(id))return;edgeSeen.add(id);solidEdges.push({pts,key,name})}
const E=(a,b,key,name)=>addEdge([a,b],key,name);
const box=(x0,x1,y0,y1,z0,z1,key,name,faces=['top','bottom','left','right','front','back'])=>{
 const facesByName={top:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],bottom:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],left:[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]],right:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]],front:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],back:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]};
 for(const f of faces)addFace(facesByName[f],key,name);
};
// Only the exposed boundary of the union is used as an occluding surface.
box(-BF,BF,0,FD,0,BH,'base','底板',['bottom','left','right','back']);
box(-TF,TF,FD,TD,0,d.tongueHeight,'tongue','台阶',['top','bottom','left','right','front']);
for(const [x0,x1,y0,y1] of [[-BF,-BW,0,FD],[BW,BF,0,FD],[-BW,BW,BD,FD],[-SH,SH,0,BD]])addFace([[x0,y0,BH],[x1,y0,BH],[x1,y1,BH],[x0,y1,BH]],'base','底板上表面');
for(const [x0,x1,z0] of [[-BF,-TF,0],[-TF,TF,d.tongueHeight],[TF,BF,0]])addFace([[x0,FD,z0],[x1,FD,z0],[x1,FD,BH],[x0,FD,BH]],'base','底板前表面');
// Perforated front and rear wall faces: left and right strips around one circular opening.
const zs=[BH,SC,...Array.from({length:32},(_,i)=>SC+(d.holeCrown-SC)*(i+1)/32)];
for(const y of [0,BD]){
 for(let i=0;i<zs.length-1;i++){
   const z0=zs[i],z1=zs[i+1],h0=shapeGeometry.crownHalf(z0),h1=shapeGeometry.crownHalf(z1);
   addFace([[-BW,y,z0],[-h0,y,z0],[-h1,y,z1],[-BW,y,z1]],'body','主体正平面');
   addFace([[h0,y,z0],[BW,y,z0],[BW,y,z1],[h1,y,z1]],'body','主体正平面');
 }
 addFace([[-BW,y,d.holeCrown],[BW,y,d.holeCrown],[BW,y,WT],[-BW,y,WT]],'body','孔顶上方墙面');
}
addFace([[-BW,0,BH],[-BW,BD,BH],[-BW,BD,WT],[-BW,0,WT]],'body','主体左侧面');
addFace([[BW,0,BH],[BW,BD,BH],[BW,BD,WT],[BW,0,WT]],'body','主体右侧面');
for(const x of [-SH,SH])addFace([[x,0,BH],[x,BD,BH],[x,BD,SC],[x,0,SC]],'hole','孔道直壁');
const frontArc=shapeGeometry.arc(BD),backArc=shapeGeometry.arc(0);
for(let i=0;i<frontArc.length-1;i++)addFace([backArc[i],frontArc[i],frontArc[i+1],backArc[i+1]],'hole','圆弧孔道曲面');
const roofCorners=[[-BW,0,WT],[BW,0,WT],[BW,BD,WT],[-BW,BD,WT]],apex=[0,BD/2,d.roofApex];
for(let i=0;i<4;i++)addFace([roofCorners[i],roofCorners[(i+1)%4],apex],'roof','四面坡屋顶');
// Physical outlines and creases. Meshing lines on the cylindrical wall are omitted.
for(const z of [0,BH]){
 E([-BF,0,z],[BF,0,z],'base','底板后棱');
 for(const x of [-BF,BF])E([x,0,z],[x,FD,z],'base','底板侧棱');
 if(z===BH)E([-BF,FD,z],[BF,FD,z],'base','底板前上棱');
 else for(const [x0,x1] of [[-BF,-TF],[TF,BF]])E([x0,FD,z],[x1,FD,z],'base','底板前下棱');
}
for(const x of [-BF,BF])for(const y of [0,FD])E([x,y,0],[x,y,BH],'base','底板竖棱');
for(const x of [-TF,TF]){
 E([x,FD,0],[x,TD,0],'tongue','台阶下侧棱');E([x,FD,d.tongueHeight],[x,TD,d.tongueHeight],'tongue','台阶上侧棱');
 E([x,TD,0],[x,TD,d.tongueHeight],'tongue','台阶前竖棱');E([x,FD,0],[x,FD,d.tongueHeight],'tongue','台阶后竖棱');
}
E([-TF,FD,d.tongueHeight],[TF,FD,d.tongueHeight],'tongue','台阶后上棱');
E([-TF,TD,d.tongueHeight],[TF,TD,d.tongueHeight],'tongue','台阶前上棱');
E([-TF,TD,0],[TF,TD,0],'tongue','台阶前下棱');
for(const x of [-BW,BW])for(const y of [0,BD])E([x,y,BH],[x,y,WT],'body','主体竖棱');
for(const x of [-BW,BW])E([x,0,BH],[x,BD,BH],'body','主体底侧棱');
for(const y of [0,BD]){
 for(const [x0,x1] of [[-BW,-SH],[SH,BW]])E([x0,y,BH],[x1,y,BH],'body','主体底棱');
 addEdge(y===0?backArc:frontArc,'hole','拱孔圆弧边缘');
 for(const x of [-SH,SH])E([x,y,BH],[x,y,SC],'hole','拱孔侧棱');
}
for(const x of [-SH,SH])for(const z of [BH,SC])E([x,0,z],[x,BD,z],'hole','孔道交接棱');
for(let i=0;i<4;i++){E(roofCorners[i],roofCorners[(i+1)%4],'roof','屋檐折棱');E(roofCorners[i],apex,'roof','屋顶坡棱')}

function makeLesson(){
 const k=1.07,a=Math.SQRT1_2/2,origin=[652,504];
 const F=(x,z)=>[194+k*x,310-k*z],S=(y,z)=>[376+k*y,310-k*z];
 const I=(x,y,z)=>[origin[0]+k*(x+a*y),origin[1]+k*(a*y-z)];
  const line=(a,b,order=0,extra={})=>({type:'line',a,b,order,...extra});
  const text=(xy,t,dx=0,dy=0,order=0)=>({type:'text',xy,text:t,dx,dy,order});
  const point=(p,order)=>({type:'point',xy:I(...p),order});
  const poly=(pts,order=0,closed=false)=>({type:'path',points:pts,order,closed});
  const L=(a,b,order)=>line(I(...a),I(...b),order);
  const brace=(p,q,offset,order,removeAfter)=>{const dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1,n=[-dy/len,dx/len],at=(t,h)=>[p[0]+t*dx+n[0]*h,p[1]+t*dy+n[1]*h],s=Math.sign(offset),pts=[at(0,offset),at(.2,offset),at(.4,offset),at(.5,offset+s*5),at(.6,offset),at(.8,offset),at(1,offset)];return{type:'path',d:'M'+pts[0]+' C'+pts[1]+' '+pts[2]+' '+pts[3]+' C'+pts[4]+' '+pts[5]+' '+pts[6],order,temporary:true,removeAfter}};
  const intersect=(p,q,r,s)=>{const dx=q[0]-p[0],dy=q[1]-p[1],ex=s[0]-r[0],ey=s[1]-r[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)throw Error('半长构造辅助线平行');const t=((r[0]-p[0])*ey-(r[1]-p[1])*ex)/den;return[p[0]+t*dx,p[1]+t*dy]};
  const measured=(p,q,seq,view,aux=false)=>{
    const order=seq*14,removeAfter=order+13,src=view==='front'?r=>F(r[0],r[2]):r=>S(r[1],r[2]),s=src(p),t=src(q),u=I(...p),v=I(...q),tmp={temporary:true,removeAfter},out=[];
    const mark=(xy,o)=>({type:'point',xy,order:o,...tmp});
    const isDepth=view==='side'&&Math.abs(q[0]-p[0])<1e-8&&Math.abs(q[1]-p[1])>1e-8;
    if(isDepth){
      out.push(line(s,t,order,tmp));let m,halfOrder;
      const direct=false;
      if(direct){m=P(0,shapeGeometry.d.depth/2);out.push(mark(m,order+1));halfOrder=order+2}
      else{
        const side=s[0]<450?1:-1,unit=[side*36,12],u1=[s[0]+unit[0],s[1]+unit[1]],u2=[s[0]+2*unit[0],s[1]+2*unit[1]],parallel=[u1[0]+t[0]-u2[0],u1[1]+t[1]-u2[1]];
        m=intersect(s,t,u1,parallel);
        const len=Math.hypot(...unit),normal=[-unit[1]/len*3.5,unit[0]/len*3.5],tick=(p,o)=>line([p[0]-normal[0],p[1]-normal[1]],[p[0]+normal[0],p[1]+normal[1]],o,tmp);
        out.push(line(s,u1,order+1,tmp),tick(u1,order+2),mark(u1,order+2),line(u1,u2,order+3,tmp),tick(u2,order+4),mark(u2,order+4));
        out.push(line(u2,t,order+5,tmp),line(u1,m,order+6,tmp),mark(m,order+7));halfOrder=order+8;
      }
      out.push(line(s,m,halfOrder,tmp),brace(s,m,8,halfOrder,removeAfter),line(u,v,order+10,tmp),brace(u,v,-8,order+10,removeAfter));
    }else out.push(line(s,t,order,tmp),brace(s,t,8,order,removeAfter),line(u,v,order+2,tmp),brace(u,v,-8,order+2,removeAfter));
    out.push({...L(p,q,order+13),...(aux?tmp:{})});return out;
  };

 const circularArc=(project,order=0)=>{const p=project(-SH,SC),q=project(SH,SC),r=k*d.holeRadius;return{type:'path',d:'M'+p[0]+','+p[1]+' A'+r+' '+r+' 0 1 1 '+q[0]+','+q[1],order}};
 const givenLine=(p,q,project,extra={})=>line(project(p),project(q),0,extra);
 const givenFront=[],givenSide=[],f=(x,z)=>F(x,z),s=(y,z)=>S(y,z);
 const gf=(x0,z0,x1,z1)=>givenFront.push(line(f(x0,z0),f(x1,z1)));
 const gs=(y0,z0,y1,z1,hidden=false)=>givenSide.push({...line(s(y0,z0),s(y1,z1)),...(hidden?{hidden:true}:{})});
 // Front and side projections are generated from the same dimensions and arch curve.
 gf(-BF,0,BF,0);gf(-BF,BH,BF,BH);gf(-BF,0,-BF,BH);gf(BF,0,BF,BH);
 gf(-TF,d.tongueHeight,TF,d.tongueHeight);gf(-TF,0,-TF,d.tongueHeight);gf(TF,0,TF,d.tongueHeight);
 gf(-BW,BH,-BW,WT);gf(BW,BH,BW,WT);gf(-BW,WT,BW,WT);gf(-BW,WT,0,d.roofApex);gf(0,d.roofApex,BW,WT);
 givenFront.push(circularArc(f));
 for(const x of [-SH,SH])gf(x,BH,x,SC);
 gs(0,0,TD,0);gs(0,0,0,WT);gs(0,BH,FD,BH);gs(FD,0,FD,BH);gs(FD,d.tongueHeight,TD,d.tongueHeight);gs(TD,0,TD,d.tongueHeight);
 gs(BD,BH,BD,WT);gs(0,WT,BD,WT);gs(0,WT,BD/2,d.roofApex);gs(BD/2,d.roofApex,BD,WT);
 gs(0,d.holeCrown,BD,d.holeCrown,true);gs(0,SC,BD,SC,true);

function drawModel(){modelSvg.replaceChildren();const faces=solidFaces.map((f,index)=>{const q=f.pts.map(project3);return{f,index,q,plane:screenPlane(q),depth:q.reduce((s,p)=>s+p[2],0)/q.length}});[...faces].sort((a,b)=>a.depth-b.depth).forEach(({f,index,q})=>modelSvg.append(node('polygon',{points:q.map(p=>p[0]+','+p[1]).join(' '),fill:selected?.kind==='face'&&selected.index===index?'#d65aa0':'#a8d4d0',stroke:'none','data-kind':'face','data-index':index,'aria-label':f.name})));solidEdges.forEach((e,index)=>{for(const q of visibleFragments(e.pts.map(project3),faces)){const pts=q.map(p=>p[0]+','+p[1]).join(' '),on=selected&&(selected.kind==='edge'&&selected.index===index||selected.kind==='group'&&selected.key===e.key);modelSvg.append(node('polyline',{points:pts,fill:'none',stroke:'transparent','stroke-width':12,'pointer-events':'stroke','data-kind':'edge','data-index':index,'aria-label':e.name}));modelSvg.append(node('polyline',{points:pts,fill:'none',stroke:on?'#b72a80':'#31535d','stroke-width':on?3.4:1.7,'stroke-linejoin':'round','stroke-linecap':'round','pointer-events':'none'}))}})}
function drawProjectionHighlight(){$('selectionOverlay')?.remove();if(!selected)return;const g=node('g',{id:'selectionOverlay'}),projectors=Object.values(lesson.project3);let objects=[];if(selected.kind==='edge')objects=[solidEdges[selected.index]];else if(selected.kind==='face')objects=[{pts:solidFaces[selected.index].pts,closed:true}];else objects=solidEdges.filter(e=>e.key===selected.key);for(const obj of objects)for(const project of projectors){const pts=obj.pts.map(project),d=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ')+(obj.closed?' Z':'');g.append(node('path',{d,class:'selection-highlight'}))}$('scene').append(g)}
function selectModel(value){selected=value;drawModel();drawProjectionHighlight();$('modelSelect').value=value?.kind==='group'?value.key:''}
modelStage.onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,yaw:modelYaw,pitch:modelPitch,kind:e.target.dataset.kind,index:Number(e.target.dataset.index)};modelMoved=false;modelStage.setPointerCapture(e.pointerId);e.preventDefault()};modelStage.onpointermove=e=>{if(!modelDrag)return;if(Math.hypot(e.clientX-modelDrag.x,e.clientY-modelDrag.y)>4)modelMoved=true;if(modelMoved){modelYaw=modelDrag.yaw+(e.clientX-modelDrag.x)*.012;modelPitch=modelDrag.pitch+(e.clientY-modelDrag.y)*.012;drawModel()}};modelStage.onpointerup=()=>{if(modelDrag&&!modelMoved&&modelDrag.kind)selectModel({kind:modelDrag.kind,index:modelDrag.index});modelDrag=null};modelStage.onpointercancel=()=>modelDrag=null;modelStage.addEventListener('wheel',e=>{e.preventDefault();modelScale=Math.max(.58,Math.min(1.55,modelScale-e.deltaY*.001));drawModel()},{passive:false});modelStage.onkeydown=e=>{const d=.14;if(e.key==='ArrowLeft')modelYaw-=d;else if(e.key==='ArrowRight')modelYaw+=d;else if(e.key==='ArrowUp')modelPitch-=d;else if(e.key==='ArrowDown')modelPitch+=d;else return;e.preventDefault();drawModel()};$('modelToggle').onclick=()=>{const show=modelStage.hidden;modelStage.hidden=!show;$('modelTools').hidden=!show;$('modelToggle').textContent=show?'隐藏模型':'显示模型';$('modelToggle').setAttribute('aria-expanded',String(show));if(show){drawModel();modelStage.focus()}else selectModel(null)};$('modelSelect').onchange=e=>selectModel(e.target.value?{kind:'group',key:e.target.value}:null);$('modelClear').onclick=()=>selectModel(null);$('modelReset').onclick=()=>{modelYaw=defaultYaw;modelPitch=defaultPitch;modelScale=1;drawModel();modelStage.focus()};
buildVisibleAnswer();drawModel();render(false);
</script>

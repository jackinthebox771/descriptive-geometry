 // Join contiguous pieces before applying dashes, so short samples do not reset each dash.
 const strokes=[...vg.querySelectorAll('[data-hidden]')];let active=null,lastEnd=null;
 for(const n of strokes){const coords=n.getAttribute('d').match(/-?\d+(?:\.\d+)?(?:e[+-]?\d+)?/gi).map(Number),start=coords.slice(0,2),end=coords.slice(2,4);
 if(active&&active.dataset.hidden===n.dataset.hidden&&Math.hypot(start[0]-lastEnd[0],start[1]-lastEnd[1])<.02){active.setAttribute('d',active.getAttribute('d')+' L'+end.join(','));n.remove();}else active=n;lastEnd=end;}
 if(edge){const ps=edge.path.map(fn);if(ps.every(p=>Math.hypot(p[0]-ps[0][0],p[1]-ps[0][1])<.1))vg.append(node('circle',{cx:ps[0][0],cy:ps[0][1],r:4}));}
 }return group;
}
function updateHighlight(){document.querySelectorAll('.selection-overlay').forEach(n=>n.remove());if(selected&&!$('modelContent').hidden)$('scene').append(overlay(selected.f,'selection-overlay',[0,1,2],selected.edge));}
function updateTeaching(animate){clearTimeout(teachingTimer);document.querySelectorAll('.teaching-overlay').forEach(n=>n.remove());const f={4:wall,7:slope}[current];if(!f)return;
 const g=overlay(f,'teaching-overlay'),step=current;
 const show=()=>{if(current===step)$('scene').append(g)};
 if(animate&&drawDuration)teachingTimer=setTimeout(show,drawDuration+30);else show();}
function choose(s){selected=s;$('faceSelect').value=s&&!s.edge?s.f.id:'';$('modelSelection').textContent=s?'已选：'+(s.edge?s.edge.name:s.f.name):'尚未选择线或面';drawModel();updateHighlight()}
function drawModel(){if($('modelContent').hidden)return;const cam=camera();$('model').replaceChildren();
 const visible=tiles.filter(t=>(t.normal||t.f.normal).reduce((s,n,i)=>s+n*cam[i],0)>0.00001);
 visible.sort((a,b)=>a.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/a.vertices.length-b.vertices.reduce((s,p)=>s+projectModel(p)[2],0)/b.vertices.length);
 for(const t of visible){const n=t.normal||t.f.normal,light=.45+.55*Math.max(0,n.reduce((s,v,i)=>s+v*cam[i],0)),color=selected?.f===t.f&&!selected.edge?'#dfa5ce':`rgb(${Math.round(106+75*light)},${Math.round(151+60*light)},${Math.round(163+55*light)})`;
 $('model').append(node('path',{d:pathD(t.vertices.map(projectModel)),fill:color,stroke:color,'stroke-width':.35,'data-face':t.f.id}));}
 // Draw physical edges only; the smooth cylinder has no artificial mesh edges.
 for(const e of edges){let run=[];function flush(){if(run.length>1)$('model').append(node('path',{d:pathD(run.map(projectModel),false),fill:'none',stroke:selected?.edge===e?'#b72a80':'#446570','stroke-width':selected?.edge===e?3:1.25,'data-edge':e.id}));run=[];}
 for(const [a,b] of segments(e.path)){const mid=a.map((v,i)=>(v+b[i])/2);if(!obscured(mid,cam)){if(!run.length)run.push(a);run.push(b)}else flush()}flush();}
 $('modelMinus').disabled=modelScale<=.6;$('modelPlus').disabled=modelScale>=1.7;
}
$('faceSelect').replaceChildren(new Option('选择空间面…',''));faces.forEach(f=>$('faceSelect').add(new Option(f.name,f.id)));
$('faceSelect').onchange=e=>choose(e.target.value===''?null:{f:faces[+e.target.value]});
$('toggleModel').onclick=()=>{const h=!$('modelContent').hidden;$('modelContent').hidden=h;document.querySelector('.workspace').classList.toggle('model-open',!h);$('toggleModel').textContent=h?'显示 3D 模型':'隐藏 3D 模型';$('toggleModel').setAttribute('aria-expanded',!h);drawModel();updateHighlight()};
function modelZoom(d){modelScale=Math.max(.6,Math.min(1.7,modelScale+d));drawModel()}
$('modelMinus').onclick=()=>modelZoom(-.1);$('modelPlus').onclick=()=>modelZoom(.1);$('modelReset').onclick=()=>{az=-.25;el=.48;modelScale=1;drawModel()};$('clearSelection').onclick=()=>choose(null);
$('model').onwheel=e=>{e.preventDefault();modelZoom(e.deltaY>0?-.08:.08)};
$('model').onpointerdown=e=>{modelDrag={x:e.clientX,y:e.clientY,az,el,target:e.target,moved:false};$('model').setPointerCapture(e.pointerId)};
$('model').onpointermove=e=>{if(!modelDrag)return;const dx=e.clientX-modelDrag.x,dy=e.clientY-modelDrag.y;if(Math.hypot(dx,dy)>4)modelDrag.moved=true;if(modelDrag.moved){az=modelDrag.az+dx*.009;el=Math.max(-1.5,Math.min(1.5,modelDrag.el+dy*.009));drawModel()}};
$('model').onpointerup=()=>{if(!modelDrag)return;const d=modelDrag;modelDrag=null;if(d.moved)return;const t=d.target;if(t.dataset.edge!==undefined){const edge=edges[+t.dataset.edge];choose({f:edge.f,edge})}else if(t.dataset.face!==undefined)choose({f:faces[+t.dataset.face]});else choose(null)};
$('model').onpointercancel=()=>modelDrag=null;
render();drawModel();

</script></body></html>
